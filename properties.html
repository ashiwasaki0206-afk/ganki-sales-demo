<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物件・台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="ganki-base.css">
<style>
#view{display:flex;flex-direction:column;gap:14px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard h3{font-size:15px}
.pcard .meta{font-size:12px;color:var(--muted)}
.occ{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.occ span{display:block;height:100%}
.occ .o{background:var(--ok)}.occ .w{background:#b07a12}.occ .v{background:#6f86d6}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl li:before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--surface);border:3px solid var(--input);position:relative;z-index:1}
.tl .new .dot{border-color:var(--primary)}.tl .now .dot{border-color:var(--ok)}
.tl .t{font-weight:500;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl .s{font-size:12px;color:var(--muted)}
.tel{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.edit-row .field{flex:1 1 120px}
.edit-row .err{flex:1 0 100%}
.tl .t .act{font-weight:400}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap}
.room-nav{display:flex;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.room-nav .pos{flex:1;text-align:center}
</style></head>
<body><div class="topbar" id="topbar"></div><div class="app"><aside class="side" id="side"></aside><main class="main" id="main">
 <header class="head">
  <div><h1>物件・台帳</h1><p class="sub" id="headSub"></p></div>
  <div class="head-actions"><a class="btn primary" href="register.html">＋ 物件をまとめて登録</a><a class="btn" href="import.html">Excelから取り込む</a><a class="btn" href="turnover.html">入居者の入れ替え</a></div>
 </header>
 <div class="seg" role="group" aria-label="表示の切り替え" id="views"></div>
 <section id="view"></section>
</main></div>
<div id="panel"></div><div id="toast"></div>
<script src="ganki-local-data.js"></script>
<script src="ganki-data.js"></script>
<script src="ganki-dropbox.js"></script>
<script src="ganki-jonojo.js"></script>
<script>
(function(){
GK.shell('properties.html');
if(GK.pageGate('page.props'))return; /* 機能の設定: this screen is OFF for the current person */
/* always read GK.db at use time: another tab's save can replace it (window.GKrefresh below) */
var $=function(s){return document.querySelector(s)},esc=GK.esc;
/* date text goes into HTML: escape it (typed takeover dates); normal dates are unchanged */
var jp=function(s){return esc(GK.jp(s))},sd=function(s){return esc(GK.sd(s))},sdw=function(s){return esc(GK.sdw(s))};
var S={view:'props',q:'',prop:'',st:'',all:false,panel:null,tab:'sum',shown:{},edit:false,ed:null,edBase:null,nd:{}};
var VIEWS=[['props','物件'],['rooms','部屋の一覧'],['owners','オーナー']];
var NOREG='<span class="cap">未登録</span>';
/* 「電話する」 (ganki-data.js: the call goes into the history at once) and the 「発信」 pill; '' with an older ganki-data.js */
function callBtn(tel,o){return typeof GK.callLink==='function'?GK.callLink(tel,o):''}
function callMark(t){return typeof GK.callPill==='function'?GK.callPill(t):''}
/* phone numbers in the 090-1234-5678 form on screen (ganki-data.js); stored numbers are not rewritten */
function ft(s){var v=s==null?'':String(s);return typeof GK.formatTel==='function'?GK.formatTel(v):v}
function rooms(){var db=GK.db;return GK.db.units.map(function(u){var p=GK.prop(u.prop)||{id:u.prop,n:u.prop,addr:'',owner:''},a=GK.activeLease(u.id),t=a&&(GK.tenant(a.tenant)||{id:a.tenant,n:'（未登録）',k:'',tel:''}),ap=GK.db.leases.filter(function(l){return l.unit===u.id&&(l.status==='申込中'||l.status==='入居予定')})[0];return {u:u,p:p,a:a,t:t,ap:ap,apT:ap&&(GK.tenant(ap.tenant)||{n:'（未登録）'}),st:GK.unitStatus(u),ar:a?GK.arrears(a.id):[]}})}
function statusGroup(st){return st==='入居中'?'入居中':st==='退去予定'?'退去予定':'空室'}
function stLabel(s){return s==='空室'?'空室（募集中・修繕中・申込あり）':s==='未収'?'未収あり':s}
function layArea(u){return (u.lay&&u.lay!=='未登録'?esc(u.lay):'間取り 未登録')+' · '+(u.area>0?u.area+'㎡':'面積 未登録')}
/* takeover data: start date may be unknown, deposit / fee may be missing */
function startTxt(l){return l.startUnknown||!l.start?'始まり 確認中':jp(l.start)}
function yenOr(n,txt){return n?GK.yen(n):(txt||'未登録')}
function edBase(u){return {lay:u.lay&&u.lay!=='未登録'?String(u.lay):'',area:u.area>0?String(u.area):'',rent:u.rent?String(u.rent):''}}
/* 書類（Dropbox） (2026-10-19, ganki-dropbox.js): the list for a room (書類 tab) and for a property (its own panel) */
function dbxOn(){return !!(GK.dbx&&GK.can('doc.dbx'))}
function dbxHtml(o){if(!dbxOn())return '';o.canOpen=GK.can('doc.dbxopen');o.canLink=GK.can('doc.dbxlink');return GK.dbx.sectionHtml(o)}

function renderViews(){$('#views').innerHTML=VIEWS.map(function(v){return '<button type="button" data-view="'+v[0]+'" aria-pressed="'+(S.view===v[0])+'">'+v[1]+'</button>'}).join('')}
function renderHead(){var R=rooms(),occ=R.filter(function(r){return r.st==='入居中'||r.st==='退去予定'}).length;$('#headSub').textContent='管理物件 '+GK.db.props.length+'棟 · '+R.length+'室 · 入居率 '+(R.length?Math.round(occ/R.length*1000)/10:0)+'%'}
function render(){renderViews();renderHead();({props:viewProps,rooms:viewRooms,owners:viewOwners})[S.view]();renderPanel()}

function viewProps(){
 var R=rooms();
 var h='<div class="toolbar"><input class="search" type="search" id="pq" placeholder="物件名・住所・オーナーで探す" aria-label="物件を探す" value="'+esc(S.q)+'"></div><div class="pcards">';
 var list=GK.db.props.filter(function(p){var o=GK.owner(p.owner);return GK.hit(S.q,[p.n,p.addr||'',p.id,o?o.n:''])});
 h+=list.map(function(p){
  var rs=R.filter(function(r){return r.u.prop===p.id}),o=GK.owner(p.owner),n=rs.length||1;
  var c={o:rs.filter(function(r){return r.st==='入居中'}).length,w:rs.filter(function(r){return r.st==='退去予定'}).length};c.v=rs.length-c.o-c.w;
  var ar=rs.filter(function(r){return r.ar.length}).length;
  var pm=p.prevMgr&&p.prevMgr.n?'<div class="meta">前の管理会社：'+esc(p.prevMgr.n)+'</div>':'';
  return '<article class="pcard" id="prop-'+esc(p.id)+'"><div><h3>'+GK.hl(p.n,S.q)+(p.takeover?' <span class="pill info">引継ぎ</span>':'')+'</h3><div class="meta">'+esc(p.id)+' · '+(p.type?esc(p.type):'構造・築年 未登録')+'</div><div class="meta">'+(p.addr?GK.hl(p.addr,S.q):'所在地 未登録')+'</div>'+pm+'</div>'+
   '<div class="meta">オーナー：'+(o?'<button class="link" type="button" data-owner="'+esc(o.id)+'">'+GK.hl(o.n,S.q)+'</button>':'未登録')+' · 管理開始 '+(p.since?jp(p.since):'未登録')+'</div>'+
   '<div class="occ" role="img" aria-label="入居 '+c.o+'室・退去予定 '+c.w+'室・空室 '+c.v+'室"><span class="o" style="width:'+(c.o/n*100)+'%"></span><span class="w" style="width:'+(c.w/n*100)+'%"></span><span class="v" style="width:'+(c.v/n*100)+'%"></span></div>'+
   '<div class="legend"><span><i style="background:var(--ok)"></i>入居 '+c.o+'</span><span><i style="background:#b07a12"></i>退去予定 '+c.w+'</span><span><i style="background:#6f86d6"></i>空室 '+c.v+'</span>'+(ar?'<span class="pill danger">未収 '+ar+'室</span>':'')+'</div>'+
   '<div class="acts"><button class="act" type="button" data-roomsof="'+esc(p.id)+'">部屋を見る（'+rs.length+'室）</button>'+(c.v?'<button class="act" type="button" data-vacantof="'+esc(p.id)+'" aria-label="'+esc(p.n)+'の空室だけを見る">空室だけ</button>':'')+'<a class="act" href="register.html#prop-'+esc(p.id)+'" aria-label="'+esc(p.n)+'に部屋を追加">部屋を追加</a>'+(dbxOn()?'<button class="act" type="button" data-propdocs="'+esc(p.id)+'" aria-label="'+esc(p.n)+'の書類（Dropbox）を見る">書類（Dropbox）</button>':'')+'</div></article>';
 }).join('');
 if(!list.length)h+='<p class="empty">一致する物件はありません。</p>';
 $('#view').innerHTML=h+'</div>';
}
function viewRooms(){
 var R=rooms(),q=S.q;
 var cnt=function(g){return R.filter(function(r){return (!S.prop||r.u.prop===S.prop)&&(g==='未収'?r.ar.length:statusGroup(r.st)===g)}).length};
 var h='<div class="stats" role="group" aria-label="状態で絞り込む">'+[['入居中','ok'],['退去予定','warn'],['空室','info'],['未収','danger']].map(function(x){return '<button type="button" class="stat '+x[1]+'" data-st="'+x[0]+'" aria-pressed="'+(S.st===x[0])+'"><span class="k">'+stLabel(x[0])+'</span><span class="v">'+cnt(x[0])+'<small>室</small></span></button>'}).join('')+'</div>';
 h+='<div class="toolbar"><input class="search" type="search" id="rq" placeholder="物件・号室・入居者・フリガナで探す（例：桜台、301、井上）" aria-label="部屋を探す" value="'+esc(q)+'"><select id="rp" aria-label="物件で絞り込む"><option value="">すべての物件</option>'+GK.db.props.map(function(p){return '<option value="'+esc(p.id)+'"'+(S.prop===p.id?' selected':'')+'>'+esc(p.n)+'</option>'}).join('')+'</select></div>';
 var list=R.filter(function(r){
  if(S.prop&&r.u.prop!==S.prop)return false;
  if(S.st&&(S.st==='未収'?!r.ar.length:statusGroup(r.st)!==S.st))return false;
  return GK.hit(q,[r.p.n,r.u.no,r.u.id,r.t?r.t.n:'',r.t?r.t.k||'':'',r.apT?r.apT.n:'']);
 });
 var notes=[];if(S.st)notes.push('「'+stLabel(S.st)+'」だけ表示中 <button class="link" type="button" data-st="'+S.st+'">解除</button>');if(S.prop)notes.push(esc((GK.prop(S.prop)||{n:S.prop}).n)+'だけ <button class="link" type="button" id="clearProp">解除</button>');if(q)notes.push('「'+esc(q)+'」に一致 <button class="link" type="button" id="clearQ">検索をやめる</button>');
 if(notes.length)h+='<div class="filter-note">'+list.length+'室 · '+notes.join(' · ')+'</div>';
 var lim=S.all?list.length:30;
 h+='<div class="tbl-wrap'+(S.all?' scroll':'')+'"><table class="tbl cards"><thead><tr><th>物件・号室</th><th>状態</th><th>入居者</th><th>契約・退去</th><th class="num">家賃＋共益費</th><th>間取り</th></tr></thead><tbody>'+
  list.slice(0,lim).map(function(r){
   var who=r.t?GK.hl(r.t.n,q)+' 様':r.ap?'<span class="s">申込：</span>'+GK.hl(r.apT.n,q)+' 様':'<span class="s">—</span>';
   var term=r.a?(r.a.notice?'<span class="pill warn">退去 '+sdw(r.a.notice.date)+'</span>':startTxt(r.a)+'〜'+jp(r.a.end)):r.ap?sd(r.ap.start)+' 入居予定':'';
   var money=(r.a?(+r.a.rent||0)+(+r.a.fee||0):(+r.u.rent||0)+(+r.u.fee||0));
   return '<tr'+(S.panel&&S.panel.room===r.u.id?' class="is-open"':'')+' data-row="'+esc(r.u.id)+'"><td><button class="rowbtn" type="button" data-room="'+esc(r.u.id)+'">'+GK.hl(r.p.n+' '+r.u.no,q)+'</button><div class="s">'+esc(r.u.id)+'</div></td><td data-label="状態">'+GK.statusPill(r.st)+(r.ar.length?' <span class="pill danger">未収</span>':'')+'</td><td data-label="入居者">'+who+'</td><td data-label="契約・退去">'+term+'</td><td class="num" data-label="家賃＋共益費">'+(money?GK.yen(money):'未登録')+'</td><td data-label="間取り">'+layArea(r.u)+'</td></tr>';
  }).join('')+'</tbody></table></div>';
 if(!list.length)h+='<p class="empty">条件に合う部屋はありません。物件・状態・検索語を変えてみてください。</p>';
 if(list.length>30)h+='<div class="more"><button class="act" type="button" id="toggleAll">'+(S.all?'たたむ（30室だけ表示）':'ほか '+(list.length-30)+'室を表示')+'</button><span class="cap">'+(S.all?'一覧の中でスクロールできます':'物件・号室の順に30室を表示中')+'</span></div>';
 $('#view').innerHTML=h;
}
function viewOwners(){
 var R=rooms();
 var h='<div class="toolbar"><input class="search" type="search" id="oq" placeholder="オーナー名・フリガナで探す" aria-label="オーナーを探す" value="'+esc(S.q)+'"><a class="btn" href="register.html">＋ オーナーを登録</a></div>';
 var list=GK.db.owners.filter(function(o){return GK.hit(S.q,[o.n,o.k||''])});
 h+='<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>オーナー</th><th>物件</th><th class="num">部屋</th><th class="num">入居率</th><th class="num">管理手数料</th><th>連絡先</th></tr></thead><tbody>'+
  list.map(function(o){var ps=GK.db.props.filter(function(p){return p.owner===o.id}),rs=R.filter(function(r){return ps.some(function(p){return p.id===r.u.prop})}),occ=rs.filter(function(r){return r.st==='入居中'||r.st==='退去予定'}).length;
   return '<tr><td><button class="rowbtn" type="button" data-owner="'+esc(o.id)+'">'+GK.hl(o.n,S.q)+'</button><div class="s">'+esc(o.k)+'</div></td><td data-label="物件">'+(ps.length?ps.map(function(p){return esc(p.n)}).join('、'):'<span class="s">なし</span>')+'</td><td class="num" data-label="部屋">'+rs.length+'</td><td class="num" data-label="入居率">'+(rs.length?Math.round(occ/rs.length*100)+'%':'—')+'</td><td class="num" data-label="管理手数料">'+(o.fee!=null&&o.fee!==''?esc(o.fee)+'%':'未登録')+'</td><td data-label="連絡先">'+(o.tel?'<span class="tel">'+esc(GK.mask(o.tel))+callBtn(o.tel,{name:o.n+' 様',role:'オーナー',ref:'owner:'+o.id})+'</span>':'未登録')+'</td></tr>'}).join('')+'</tbody></table></div>';
 if(!list.length)h+='<p class="empty">一致するオーナーはいません。</p>';
 $('#view').innerHTML=h;
}

/* ---------- panel ---------- */
function order(){var r=[...document.querySelectorAll('#view [data-room]')].map(function(b){return b.dataset.room});return r}
/* the room edit form keeps what was typed (S.ed) so a re-render does not lose it; leaving with changes asks first */
/* S.edBase = the values when 「部屋の情報を直す」 was opened; only fields changed from it are saved */
function dirty(){if(!S.edit||!S.ed||!S.panel||!S.panel.room)return false;var b=S.edBase||{};return ['lay','area','rent'].some(function(k){return String(S.ed[k]).trim()!==String(b[k]||'').trim()})}
function guard(fn){
 if(!dirty())return fn();
 var f=$('#editForm');if(!f){S.edit=false;S.ed=null;return fn()}
 GK.confirmBar(f,'入力中の内容を捨てますか？','捨てる',function(){S.edit=false;S.ed=null;fn()},{where:'beforebegin',noLabel:'入力を続ける'});
}
function openRoom(id,keep){if(!GK.unit(id))return;var prev=S.panel&&S.panel.room?S.panel:null;S.edit=false;S.ed=null;S.panel={room:id,order:keep&&prev?prev.order:order(),ret:prev?prev.ret:document.activeElement};if(!keep)S.tab='sum';try{history.replaceState(null,'','#room-'+id)}catch(e){}render();var f=document.querySelector('#panel .panel-head .btn');if(f&&!keep)f.focus()}
function openOwner(id){S.edit=false;S.ed=null;S.panel={owner:id,ret:document.activeElement};render();var f=document.querySelector('#panel .panel-head .btn');if(f)f.focus()}
function closePanel(){var r=S.panel&&S.panel.ret;S.panel=null;S.edit=false;S.ed=null;try{history.replaceState(null,'',location.pathname)}catch(e){}render();if(r&&document.body.contains(r))r.focus()}
function tabs(){return '<div class="tabs" role="tablist" aria-label="部屋の台帳の項目">'+[['sum','概要'],['hist','入居者の移り変わり'],['work','対応'],['out','退去'],['docs','書類']].map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'}
function roomBody(id){
 var db=GK.db,u=GK.unit(id),p=GK.prop(u.prop)||{id:u.prop,n:u.prop,addr:'',owner:''},o=GK.owner(p.owner),a=GK.activeLease(id),t=a&&(GK.tenant(a.tenant)||{id:a.tenant,n:'（未登録）',k:'',tel:''}),st=GK.unitStatus(u),ar=a?GK.arrears(a.id):[];
 var apl=a?null:GK.db.leases.filter(function(l){return l.unit===id&&(l.status==='申込中'||l.status==='入居予定')})[0];
 var h=tabs()+'<div>';
 if(S.tab==='sum'){
  /* 「電話する」 works without revealing: the number is looked up on press, and the call is written to this room's history */
  var callT=t&&t.tel?callBtn(t.tel,{name:t.n+' 様',role:'入居者',unit:id,ref:'tenant:'+t.id}):'';
  var tel=t?(!t.tel?NOREG:S.shown[t.id]?'<span class="tel"><b>'+esc(ft(t.tel))+'</b>'+callT+'<span class="cap">'+S.shown[t.id]+' に表示（記録済み）</span></span>':'<span class="tel">'+esc(GK.mask(t.tel))+(GK.can('pi.tel')?'<button class="act" type="button" data-reveal="'+esc(t.id)+'" aria-label="'+esc(t.n)+' 様の電話番号を表示">番号を表示</button>':'')+callT+'</span>'):'—';
  h+='<dl class="kv"><dt>状態</dt><dd>'+GK.statusPill(st)+(p.takeover?' <span class="pill info">引継ぎ</span>':'')+'</dd><dt>物件</dt><dd>'+esc(p.n)+'（'+esc(p.id)+'）<br><span class="cap">'+(p.addr?esc(p.addr):'所在地 未登録')+'</span></dd><dt>オーナー</dt><dd>'+(o?'<button class="link" type="button" data-owner="'+esc(o.id)+'">'+esc(o.n)+'</button>':'未登録')+'</dd>'+(p.prevMgr&&p.prevMgr.n?'<dt>前の管理会社</dt><dd>'+esc(p.prevMgr.n)+(p.prevMgr.tel?'<br><span class="tel"><span class="cap">'+esc(ft(p.prevMgr.tel))+'</span>'+callBtn(p.prevMgr.tel,{name:p.prevMgr.n,role:'前の管理会社',unit:id})+'</span>':'')+'</dd>':'')+'<dt>間取り・面積</dt><dd>'+layArea(u)+'</dd>'+

  S.edit=false;S.ed=null;S.edBase=null;
  if(!chg.length){render();GK.toast('変更はありませんでした');return}
  GK.log('部屋の情報を変更（間取り・面積・募集家賃）'+(ah?'：募集家賃 '+GK.yen(ah.from)+' → '+GK.yen(ah.to):''),id);GK.save();render();GK.toast('部屋の情報を保存しました',function(){var u2=GK.unit(id);if(u2){chg.forEach(function(k){u2[k]=old[k]});if(ah&&u2.askHist){u2.askHist=u2.askHist.filter(function(x){return x.id!==ah.id});if(!u2.askHist.length)delete u2.askHist}}GK.save();render()})}
 if(e.target.id==='taskForm'){if(!GK.can('act.addtask'))return;var tt=$('#tk-t').value.trim();if(!tt){setErr('tkErr','tk-t','やることを入れてください（例：網戸の修理日程を連絡）。');return}var k=GK.addTask(id,tt,$('#tk-d').value||GK.TODAY),kid=k.id;GK.log('やることを追加：'+tt,id);GK.save();renderPanel();GK.toast('追加しました。ホームの「今日確認すること」にも出ます',function(){var ts=GK.db.tasks,ix=-1;ts.forEach(function(x,i){if(x.id===kid)ix=i});if(ix>=0)ts.splice(ix,1);GK.save();renderPanel()})}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.dataset.ed&&S.ed){S.ed[t.dataset.ed]=t.value;if(t.getAttribute('aria-invalid'))setErr('eErr',t.id,'');return}
 if(t.id==='tk-t'){if(t.getAttribute('aria-invalid'))setErr('tkErr','tk-t','');return}
 if(t.dataset.draft&&S.panel&&S.panel.room){var al=GK.activeLease(S.panel.room);if(al){(S.nd[al.id]=S.nd[al.id]||{})[t.dataset.draft]=t.value}t.removeAttribute('aria-invalid');var ne=$('#nErr');if(ne)ne.textContent='';return}
 var id=t.id;if(!['pq','rq','oq'].includes(id))return;S.q=t.value;if(e.isComposing)return;S.all=false;var pos=t.selectionStart;render();var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('compositionend',function(e){var id=e.target.id;if(!['pq','rq','oq'].includes(id))return;S.q=e.target.value;render();var n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
document.addEventListener('change',function(e){if(e.target.id==='rp'){S.prop=e.target.value;S.all=false;render()}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&GK.closeConfirm())return;
 if(e.key==='Escape'&&S.panel){guard(closePanel);return}
 var typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if(!typing&&S.panel&&S.panel.room&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&!e.altKey&&!e.ctrlKey&&!e.metaKey){var b=document.querySelector('[data-nav="'+(e.key==='ArrowDown'?1:-1)+'"]');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
var wide=window.innerWidth>1180;window.addEventListener('resize',function(){var w=window.innerWidth>1180;if(w!==wide){wide=w;renderPanel()}});

/* ---- another tab saved (ganki-data.js reloads GK.db, then calls this) ----
   Unsaved input in the panel (room edit, 退去の連絡, やること) is never re-rendered away: the list updates, the panel shows a note,
   and the panel catches up on the next save / cancel / tab change. */
function keepFocus(fn){var a=document.activeElement,id=a&&a.id,s=null;try{s=[a.selectionStart,a.selectionEnd]}catch(e){}fn();if(id){var n=document.getElementById(id);if(n&&n!==a){try{n.focus();if(s&&s[0]!=null)n.setSelectionRange(s[0],s[1])}catch(e){}}}}
var composing=false,pending=false;
document.addEventListener('compositionstart',function(){composing=true});
document.addEventListener('compositionend',function(){composing=false;if(pending){pending=false;setTimeout(refresh,0)}});
function panelBusy(){
 if(!S.panel||!S.panel.room||!GK.unit(S.panel.room))return false;
 if(dirty())return true;
 var tk=document.getElementById('tk-t');if(tk&&tk.value&&tk.value.trim()&&GK.can('act.addtask'))return true;
 var al=GK.activeLease(S.panel.room),nd=al&&S.nd[al.id];return !!(nd&&Object.keys(nd).length&&S.tab==='out');
}
function refresh(){
 if(S.prop&&!GK.prop(S.prop))S.prop='';
 /* 機能の設定: a form whose feature was turned OFF here is closed (with a short note) */
 if(S.edit&&!GK.can('act.roomedit')){S.edit=false;S.ed=null;S.edBase=null;GK.offToast('物件・部屋の編集')}
 if(!GK.can('act.notice')&&Object.keys(S.nd).length){var hadOut=S.panel&&S.tab==='out';S.nd={};if(hadOut)GK.offToast('退去の連絡')}
 keepFocus(function(){
  if(panelBusy()){
   renderViews();renderHead();({props:viewProps,rooms:viewRooms,owners:viewOwners})[S.view]();
   var n=document.getElementById('syncNote'),pb=document.querySelector('#panel .panel-body');
   if(!n&&pb){pb.insertAdjacentHTML('afterbegin','<p class="sync-note" id="syncNote" role="status"></p>');n=document.getElementById('syncNote')}
   if(n){n.textContent='ほかの画面で変更がありました。保存後に最新にします';n.hidden=false}
  }else render();
 });
}
window.GKrefresh=function(){if(composing){pending=true;return}try{refresh()}catch(e){if(window.console)console.error(e)}};

/* deep links: properties.html#room-GK-0123-104 (that room) · #prop-GK-0123 (that property's rooms, first room open) */
function openFromHash(){
 var r=GK.hash('room'),pid=GK.hash('prop');
 if(r&&GK.unit(r)){S.view='rooms';S.prop=GK.unit(r).prop;S.st='';S.q='';render();openRoom(r);return true}
 if(pid&&GK.prop(pid)){
  S.view='rooms';S.prop=pid;S.st='';S.q='';render();
  var first=GK.db.units.filter(function(u){return u.prop===pid}).sort(function(a,b){return String(a.no).localeCompare(String(b.no),'ja',{numeric:true})})[0];
  if(first)openRoom(first.id);else{try{history.replaceState(null,'','#prop-'+pid)}catch(e){}}
  return true;
 }
 return false;
}
window.addEventListener('hashchange',function(){if(GK.hash('room')||GK.hash('prop'))guard(openFromHash)});
if(!openFromHash())render();
})();
