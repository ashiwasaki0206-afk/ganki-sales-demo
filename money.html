<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>入出金</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="ganki-base.css">
<style>
/* the month picker: ganki-base.css .gk-mp (GK.monthPicker) */
.mz select,.mz input[type="text"],.mz input[type="search"],.mz input[type="number"]{border:1px solid var(--input);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0;max-width:100%}
.mz-banner{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.mz-banner.closed{background:var(--ok-soft);color:var(--ok);font-weight:500}
.mz-banner.sample{background:var(--info-soft);color:var(--info)}
.mz-tabs [role="tab"]{min-height:40px;display:inline-flex;align-items:center;gap:6px}
.mz-tabs [role="tab"]:focus-visible{outline-offset:-2px}
.mz-n{font-size:11px;border-radius:999px;padding:0 7px;background:var(--surface-2);color:var(--muted);font-weight:500;line-height:1.7}
.mz-n.danger{background:var(--danger-soft);color:var(--danger)}.mz-n.warn{background:var(--warn-soft);color:var(--warn)}
#mzPanel:focus{outline:none}#mzPanel:focus-visible{outline:2px solid var(--primary)}
.mz-in{color:var(--ok);font-weight:700;white-space:nowrap}
.mz-out{color:var(--fg);font-weight:700;white-space:nowrap}
.mz-dir{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.mz-name{font-weight:500;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);line-height:1.8;margin:0 4px 4px 0;white-space:nowrap}
.chip.hi{border-color:#a9d6bd;color:var(--ok)}
.mz-alloc{display:block;overflow-wrap:anywhere}
.mz-alloc .s{font-size:12px;color:var(--muted)}
.mz-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.tbl td.mz-acts{white-space:normal;min-width:150px}
.mz-subrow td{background:var(--surface-2)}
.mz-form{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.mz-radios{display:flex;flex-wrap:wrap;gap:6px 14px}
.mz-radios label{display:flex;gap:6px;align-items:center;font-size:13px;min-height:32px;cursor:pointer}
.mz-row-btns{display:flex;flex-wrap:wrap;gap:8px}
.mz-bulk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.mz-drop{border:2px dashed var(--input);border-radius:10px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.mz-drop.is-over{border-color:var(--primary);background:var(--primary-soft)}
.mz-msg{padding:10px 12px;border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.mz-msg.ok{background:var(--ok-soft);color:var(--ok)}.mz-msg.ng{background:var(--danger-soft);color:var(--danger)}.mz-msg.info{background:var(--info-soft);color:var(--info)}
.mz-msg ol{margin:0;padding-left:1.4em;color:var(--fg)}
.mz-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mz-box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mz-box h3,.mz-owner h3,.mz-sec h3{font-size:14px}
.mz-sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.mz-sec+.mz-sec{border-top:1px solid var(--line);padding-top:14px}
.mz-owner{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mz-owner-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.mz-tot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;font-size:13px;max-width:440px;margin:0}
.mz-tot dt{color:var(--muted)}.mz-tot dd{margin:0;text-align:right;white-space:nowrap}
.mz-tot .net{font-weight:700;font-size:16px;color:var(--fg)}
.mz-tot .none{font-weight:700;color:var(--warn);white-space:normal;text-align:right}
.mz-text{width:100%;min-height:200px;border:1px solid var(--input);border-radius:8px;padding:10px;font:inherit;font-size:12.5px;line-height:1.7;background:var(--surface);resize:vertical}
.mz-zengin{font-family:ui-monospace,"BIZ UDGothic","MS Gothic","Osaka-Mono",monospace;font-size:12px;line-height:1.5;white-space:pre;overflow:auto;max-height:280px;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}
.mz-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mz-check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mz-check li{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.mz-check li.ok{background:var(--ok-soft);color:var(--ok)}
.mz-fix{font-size:12.5px;color:var(--fg)}
.mz-fix li{margin-bottom:2px}
.mz-entry{font-size:12px;overflow-wrap:anywhere}
.mz-entry .s{color:var(--muted)}
.mz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px}
.mz-map td{padding:5px 8px}.mz-map input{width:100%}
.tbl.mz-map td{vertical-align:middle}
.mz-dirty{font-size:12.5px;color:var(--warn);font-weight:500}
.mz-ed{width:540px}
.mz-ed .panel-body{gap:14px}
.mz-line{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.mz-line .wide{grid-column:1 / -1}
.mz-line select[size]{min-height:0;padding:4px}
.mz-line-h{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mz-rest{padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;background:var(--warn-soft);color:var(--warn)}
.mz-rest.ok{background:var(--ok-soft);color:var(--ok)}.mz-rest.ng{background:var(--danger-soft);color:var(--danger)}
.mz-cands{display:flex;flex-direction:column;gap:6px}
.mz-cands .act{text-align:left;white-space:normal;padding:6px 10px;line-height:1.5}
.mz-sticky{position:sticky;bottom:0;background:var(--surface);padding:10px 0 4px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.mz-dl{display:grid;grid-template-columns:6em minmax(0,1fr);gap:2px 10px;font-size:13px;margin:0}
.mz-dl dt{color:var(--muted)}.mz-dl dd{margin:0;overflow-wrap:anywhere}
@media (max-width:900px){.mz-two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
 .mz .btn,.mz .act,.mz .seg button,.mz [role="tab"],.mz select,.mz input[type="text"],.mz input[type="search"],.mz .link,.mz-radios label{min-height:44px}
 .mz .act{display:inline-flex;align-items:center}
 .tbl.cards td.mz-acts{min-width:0;padding-left:0}
 .tbl.cards td.mz-acts::before{display:none}
 .mz-acts .act{flex:1 1 auto;justify-content:center}
 .mz-ed{width:100%;left:0;border-left:0}
 .mz-line{grid-template-columns:minmax(0,1fr)}
 .mz-tot{max-width:none}
 .mz-row-btns .btn,.mz-sticky .btn{flex:1 1 auto;justify-content:center}
 .mz details summary{min-height:44px;padding:12px 0}
}
</style></head>
<body><div class="topbar" id="topbar"></div><div class="app"><aside class="side" id="side"></aside><main class="main mz" id="main">
 <header class="head">
  <div><h1>入出金</h1><p class="sub">口座の入出金を部屋ごとに確かめ、マネーフォワードの仕訳と照合して、オーナー送金と月の締めまで行います。</p></div>
  <div class="head-actions gk-mpw mz-month"><div class="gk-mp" role="group" aria-label="表示する月"><button type="button" class="gk-mp-step" id="mzMonthPrev" data-mp="prev" data-mp-for="mzMonth" aria-label="前の月">‹<span class="gk-mp-t"> 前の月</span></button><label class="sr" for="mzMonth">表示する月</label><select id="mzMonth"></select><button type="button" class="gk-mp-step" id="mzMonthNext" data-mp="next" data-mp-for="mzMonth" aria-label="次の月"><span class="gk-mp-t">次の月 </span>›</button><button type="button" class="gk-mp-step gk-mp-now" id="mzMonthNow" data-mp="now" data-mp-for="mzMonth">今月</button></div><p class="gk-mp-hint" id="mzMonthHint" hidden></p></div>
 </header>
 <div id="mzNotes"></div>
 <div class="stats" id="mzStats" role="group" aria-label="この月のまとめ（押すとその一覧を開きます）"></div>
 <div class="tabs mz-tabs" id="mzTabs" role="tablist" aria-label="入出金の作業"></div>
 <section class="card" id="mzPanel" role="tabpanel" tabindex="0"></section>
 <p class="sr" id="mzLive" role="status" aria-live="polite"></p>
</main></div>
<div id="panel"></div><div id="toast"></div>
<script src="ganki-local-data.js"></script>
<script src="ganki-data.js"></script>
<script src="ganki-money.js"></script>
<script src="ganki-jonojo.js"></script>
<script>
(function(){
GK.shell('money.html');
if(GK.pageGate('page.money'))return; /* 機能の設定: this screen is OFF for the current person (nothing below runs, nothing is seeded) */
var X=GK.money,e=GK.esc,yen=GK.yen,$=function(s){return document.querySelector(s)};
/* typed numbers: full-width digits / commas count (１２，０００ → 12000) */
function nfk(v){var s=String(v==null?'':v);try{s=s.normalize('NFKC')}catch(x){}return s}
function digits(v){return nfk(v).replace(/[^\d]/g,'')}
var ALL_TABS=[['import','取り込み'],['check','入出金の確認'],['mf','MFとの照合'],['remit','オーナー送金'],['close','締め'],['settings','設定']];
/* 機能の設定: 取り込み・MFとの照合・設定 are tabs of their own (an OFF tab is not drawn and cannot be opened by #tab-…);
   the other actions are switched per button (ACT_FEAT): an OFF button is not drawn and its action does not run */
function tabOk(k){var f=GK.TAB_FEATURE['money.html'][k];return !f||GK.can(f)}
var TABS=ALL_TABS.filter(function(t){return tabOk(t[0])});
var ACT_FEAT={aiask:'ai.match',aipick:'ai.match',demomf:'money.import',bulk:'money.check',confirm:'money.check',adv:'money.check',edit:'money.check',skip:'money.check',reset:'money.check',edsave:'money.check',edadd:'money.check',edadv:'money.check',fix:'money.remit',unfix:'money.remit',sent:'money.remit',unsent:'money.remit',copyzg:'money.transfer',close:'money.close',reopen:'money.unclose',banksub:'money.settings',setsave:'money.settings',mapdef:'money.settings',dunsave:'money.settings',duncancel:'money.settings',dunup:'money.settings',dundown:'money.settings'};
function actOk(a){return !ACT_FEAT[a]||GK.can(ACT_FEAT[a])}
function gateHtml(h){return String(h).replace(/<button\b[^>]*\bdata-(act|go)="([\w:]+)"[^>]*>[\s\S]*?<\/button>/g,function(m,k,v){return (k==='act'?actOk(v):tabOk(v.split(':')[0]))?m:''})}
var TAB_KEY='ganki-money-tab';
var S={m:X.cur(),tab:'check',f:'all',prop:'',edit:null,skip:null,ai:null,skipD:{},over:null,mfAll:false,set:null,setT:'受託',reopen:false,reopenText:'',imp:null};
try{var t0=localStorage.getItem(TAB_KEY);if(TABS.some(function(t){return t[0]===t0}))S.tab=t0}catch(err){}
/* #tab-check / #tab-remit-2026-09 (only plain tokens survive the viewer link) */
function readHash(){
 var h=location.hash.slice(1),m=/^tab-([a-z]+)(?:-(\d{4}-\d{2}))?$/.exec(h);
 if(!m||!TABS.some(function(t){return t[0]===m[1]}))return;
 S.tab=m[1];if(m[2]&&X.monthList().indexOf(m[2])>=0)S.m=m[2];
}
readHash();
function say(t){var l=$('#mzLive');if(!l)return;l.textContent='';setTimeout(function(){l.textContent=t},30)}
function mon(m){return X.monY(m||S.m)}
function M(){return X.month(S.m)}
function closed(){return !!M().closed}
function dt(s){return e(GK.sdw(s))}
function amt(n){return n>=0?'<span class="mz-in">+'+yen(n)+'<span class="mz-dir">入金</span></span>':'<span class="mz-out">'+yen(n)+'<span class="mz-dir">出金</span></span>'}
function pill(state){var c={ok:'ok',auto:'info',none:'danger',skip:''}[state];return '<span class="pill '+(c||'')+'">'+e(X.stateLabel[state]||state)+'</span>'}
function chips(L){return (L.reasons||[]).filter(Boolean).map(function(r){return '<span class="chip'+(L.conf==='high'?' hi':'')+'">'+e(r)+'</span>'}).join('')}
function rowLabel(r){return GK.sd(r.date)+' '+(r.amount>=0?'入金':'出金')+' '+yen(Math.abs(r.amount))+' '+r.name}
function copy(text,btn,selEl){
 var ok=function(){if(btn){var o=btn.textContent;btn.textContent='コピーしました';setTimeout(function(){if(btn.isConnected)btn.textContent=o},2000)}say('コピーしました')};
 var ng=function(){try{if(selEl){if(selEl.select)selEl.select();else{var r=document.createRange();r.selectNodeContents(selEl);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}}}catch(x){}say('選びました。Ctrl+C（スマホは長押し）でコピーしてください');GK.toast('選びました。Ctrl+C（スマホは長押し）でコピーしてください')};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,ng);else ng()}catch(x){ng()}
}

/* ---------- head, notes, summary, tabs ---------- */
function renderHead(){
 var list=X.monthList();
 if(list.indexOf(S.m)<0)S.m=X.cur();
 /* 月の選び方 (GK.monthPicker): every month from the earliest one with data to this month */
 GK.monthPicker({id:'mzMonth',months:list,value:S.m,hint:X.monthHint(),label:function(m){var c=X.hasMonth(m)&&X.month(m).closed;return GK.monthText(m)+(m===X.cur()?'（今月）':'')+(c?'・締め済み':'')}});
 var n='',Mo=M();
 if(Mo.sample&&Mo.sample.demo&&(Mo.sample.bank||Mo.sample.mf))n+='<p class="mz-banner sample">見本：'+e(mon())+'はデモの過去データです（架空の口座・MFの明細、送金済み・締め済み）。</p>';
 else if(Mo.sample&&(Mo.sample.bank||Mo.sample.mf))n+='<p class="mz-banner sample">見本の明細を表示しています（'+(Mo.sample.bank?'口座':'')+(Mo.sample.bank&&Mo.sample.mf?'・':'')+(Mo.sample.mf?'MF':'')+'）。本物の明細は「取り込み」から入れると入れ替わります。</p>';
 if(Mo.closed)n+='<p class="mz-banner closed" role="note">'+e(mon())+'は締め済み（'+e(GK.sd(Mo.closed.at))+' '+e(Mo.closed.by)+'）。この月は見るだけです。<button type="button" class="link" data-go="close">締めの画面へ</button></p>';
 $('#mzNotes').innerHTML=n;
}
function renderStats(){
 var s=X.summary(S.m),c=s.closed;
 var t=function(cls,k,v,unit,go,sub){return '<button type="button" class="stat '+cls+'" data-go="'+go+'"><span class="k">'+k+'</span><span class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</span>'+(sub?'<span class="k">'+sub+'</span>':'')+'</button>'};
 $('#mzStats').innerHTML=
  t('','口座の入出金',s.rows,'件','check:all')+
  t(s.rows&&s.rooms===s.rows?'ok':'','部屋に紐付け済み',s.rooms,'件','check:ok',s.ok-s.rooms>0?'ほか オーナー・会社 '+(s.ok-s.rooms)+'件':'')+
  t(s.auto?'info':'','確認待ち',s.auto,'件','check:auto')+
  t(s.none?'danger':'','要確認',s.none,'件','check:none')+
  t(s.mf?'warn':'','MFとの食い違い',s.mfLoaded?s.mf:'—',s.mfLoaded?'件':'','mf',s.mfLoaded?'':'MF未取り込み')+
  t(c?'ok':'','締め状態',c?'締め済み':'未締め','','close',c?GK.sd(c.at)+' '+e(c.by):'');
}
function tabCount(k,s){
 if(k==='check'){var u=s.none+s.auto;return u?'<span class="mz-n'+(s.none?' danger':'')+'"><span class="sr">未確認 </span>'+u+'<span class="sr">件（要確認 '+s.none+'・確認待ち '+s.auto+'）</span></span>':''}
 if(k==='mf')return s.mf?'<span class="mz-n warn" aria-label="食い違い '+s.mf+'件">'+s.mf+'</span>':'';
 if(k==='close')return s.closed?'<span class="mz-n">済</span>':'';
 return '';
}
function renderTabs(){
 var s=X.summary(S.m);
 $('#mzTabs').innerHTML=TABS.map(function(t){var on=t[0]===S.tab;return '<button type="button" role="tab" id="tab-'+t[0]+'" aria-controls="mzPanel" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'" data-tab="'+t[0]+'">'+t[1]+tabCount(t[0],s)+'</button>'}).join('');
 $('#mzPanel').setAttribute('aria-labelledby','tab-'+S.tab);
}
function setTab(k,focusTab){
 S.tab=k;S.over=null;try{localStorage.setItem(TAB_KEY,k)}catch(err){}
 try{history.replaceState(null,'','#tab-'+k+(S.m!==X.cur()?'-'+S.m:''))}catch(err){}
 render();
 if(focusTab){var b=document.getElementById('tab-'+k);if(b)b.focus()}
}

/* ---------- 取り込み ---------- */
function impStatus(kind){
 var Mo=M(),list=Mo.imports.filter(function(i){return i.kind===kind}),last=list[list.length-1];
 var n=kind==='bank'?Mo.bank.length:Mo.mf.length,ds=(kind==='bank'?Mo.bank:Mo.mf).map(function(x){return x.date}).sort();
 var h='<div class="mz-box"><h3>'+(kind==='bank'?'口座の入出金（楽天銀行）':'マネーフォワード クラウド会計')+'</h3>';
 if(!n)return h+'<p class="cap">'+e(mon())+'の分はまだ取り込んでいません。</p></div>';
 h+='<dl class="mz-dl"><dt>件数</dt><dd>'+n+(kind==='bank'?'件':'行')+'</dd><dt>期間</dt><dd>'+e(GK.sd(ds[0]))+'〜'+e(GK.sd(ds[ds.length-1]))+'</dd>'+
  (kind==='bank'?'<dt>口座名</dt><dd>'+e(X.settings().bankName)+'</dd>':'')+
  '<dt>取り込み</dt><dd>'+(last?e(last.sample?'見本':last.file||'ファイル')+'（'+e(GK.sd(String(last.at).slice(0,10)))+' '+e(String(last.at).slice(11,16))+' '+e(last.by)+'）':'—')+'</dd></dl>';
 if(kind==='mf')h+='<p class="cap">MFで直したら、CSVを取り込み直してください（前の分と入れ替わります）。</p>';
 return h+'</div>';
}
function panelImport(){
 var c=closed(),h='<h2>取り込み（'+e(mon())+'）</h2>';
 if(c)h+='<p class="note">'+e(mon())+'は締め済みなので、取り込めません。取り込み直すときは「締め」で締めを解除してください。</p>';
 else h+='<div class="mz-drop" id="mzDrop"><p><b>CSVファイルをここにドラッグ</b>するか、ボタンで選んでください。</p><button type="button" class="btn primary" id="mzPick">CSVファイルを選ぶ</button><input type="file" id="mzFile" accept=".csv,text/csv,text/plain" multiple class="sr" tabindex="-1" aria-hidden="true">'+
  '<p class="cap">楽天銀行の入出金明細（取引日・入出金(円)・取引後残高・入出金内容。入金と出金が別の列でも読めます）と、マネーフォワード クラウド会計の仕訳帳・総勘定元帳（取引日・借方／貸方の勘定科目・補助科目・部門・金額・摘要）を自動で見分けます。文字コードは UTF-8 と Shift_JIS のどちらでも読めます。'+e(mon())+'の行だけを取り込みます。</p></div>'+
  '<div class="mz-bulk"><button type="button" class="btn" data-act="demomf">デモ用：MFで直したあとのCSVを取り込む</button><span class="cap">締めを試すためのボタンです。いまの紐付けどおりに直したMFの仕訳を取り込みます（まだ決まっていない行は仮受金・仮払金で入ります）。</span></div>';
 var I=S.imp;
 if(I&&I.m===S.m){
  if(I.garbled)h+='<div class="mz-msg ng" role="alert"><b>文字化けしています。CSVをUTF-8で保存し直してください。</b><ol><li>CSVファイルをExcelで開きます。</li><li>「ファイル」→「名前を付けて保存」を押します。</li><li>ファイルの種類で「CSV UTF-8（コンマ区切り）」を選んで保存します。</li><li>保存したファイルを、もう一度ここで選びます。</li></ol></div>';

function readFiles(files){

 var msgs=[],okAny=false,kind='',undos=[],dup=false,garbled=false,left=files.length;

  var rd=new FileReader();

   var raw=rd.result,dec=typeof raw==='string'?{text:raw,enc:''}:X.decodeBytes(raw);
   var r=X.importText(S.m,dec.text,f.name);
   if(r.ok&&dec.enc==='Shift_JIS')r.msg+='（Shift_JIS のファイルとして読みました）';
   if(r.garbled)garbled=true;
   msgs.push((files.length>1?f.name+'：':'')+r.msg);
   if(r.ok){okAny=true;kind=kind||r.kind;undos.push(r.undo)}else if(r.dup)dup=true;
   if(--left)return;
   S.imp={m:S.m,ok:okAny,dup:dup&&!okAny,garbled:garbled&&!okAny,kind:kind,msgs:msgs};
   render();

   if(okAny)GK.toast('取り込みました',function(){undos.slice().reverse().forEach(function(u){u()});S.imp=null;render();GK.toast('取り込む前に戻しました')});
  };
  rd.onerror=function(){msgs.push(f.name+'：ファイルを読めませんでした。');if(!--left){S.imp={m:S.m,ok:okAny,kind:kind,msgs:msgs};render()}};
  if(window.TextDecoder&&rd.readAsArrayBuffer)rd.readAsArrayBuffer(f);else rd.readAsText(f,'utf-8');
 });
}
