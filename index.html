<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GANKI 賃貸管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: GANKI CRM shell (dark sidebar + light work area) with a 12-column block board that switches into an edit mode. Colors follow GANKI's own globals.css tokens. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#edf0f5; --fg:#1b2535; --muted:#596579; --line:#dfe4ec; --input:#cbd3df;
  --primary:#3359f2; --primary-fg:#ffffff; --primary-soft:#e9eefb;
  --sidebar:#151b26; --sidebar-fg:#f5f7fb; --sidebar-muted:#aeb9cb; --sidebar-active:#253044;
  --danger:#b4332b; --danger-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fdf1d8; --ok:#1d7148; --ok-soft:#e1f3e9; --info:#2c4fd6; --info-soft:#e9eefb;
  --scrim:rgba(10,14,20,.35);
  --shadow:0 1px 2px rgba(27,37,53,.06),0 4px 14px rgba(27,37,53,.06);
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --r:10px;
  color-scheme:light; /* light only: dark mode removed at the user's request */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
/* shell: the same sidebar + 「メニュー」 topbar as the other pages (rules copied from ganki-base.css; filled by GK.shell) */
.side{background:var(--sidebar);color:var(--sidebar-fg);padding-block:18px;padding-inline:12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding-inline:8px;font-weight:700;letter-spacing:.08em;color:var(--sidebar-fg);text-decoration:none}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--primary);display:grid;place-items:center;font-size:13px;color:var(--primary-fg);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;color:var(--sidebar-muted);letter-spacing:.08em;padding:8px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;color:var(--sidebar-muted);font-size:13.5px;text-decoration:none}
.nav a:hover{background:var(--sidebar-active);color:var(--sidebar-fg)}
.nav a[aria-current="page"]{background:var(--sidebar-active);color:var(--sidebar-fg);font-weight:500}
.nav a:focus-visible{outline:2px solid var(--primary)}
.side-foot{margin-top:auto;font-size:12px;color:var(--sidebar-muted);padding-inline:10px}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:fixed;inset:0 auto 0 0;width:240px;z-index:50;height:auto}
  body.nav-open .side{display:flex}
  body.nav-open::after{content:"";position:fixed;inset:0;background:var(--scrim);z-index:49}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sidebar);color:var(--sidebar-fg);position:sticky;top:0;z-index:30}
  .topbar button{border:1px solid #39465c;background:none;color:var(--sidebar-fg);border-radius:7px;padding:4px 10px}
  .topbar b{letter-spacing:.06em}
}

.main{min-width:0;padding-block:16px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:14px}

.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;border:1px dashed var(--input);border-radius:var(--r);background:var(--surface-2)}
.proto-tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);font-weight:500}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.proto-note{font-size:12px;color:var(--muted);min-width:0;margin:0}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:22px;font-weight:700}
.head .date{font-size:13px;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--input)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:500}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface-2)}
.btn svg{width:15px;height:15px}

.quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.quick-label{font-size:12px;color:var(--muted);font-weight:500;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px}
.chip:hover{border-color:var(--primary)}
.quick.editing .chip{background:var(--surface);border-style:dashed;cursor:grab;padding-right:6px}
.chip .x{border:0;background:transparent;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0}
.chip .x:hover{background:var(--danger-soft);color:var(--danger)}
.quick.editing .chip.add{border-style:dashed;background:transparent;color:var(--primary);cursor:pointer;padding-right:12px}
.chip.drop-before{box-shadow:-3px 0 0 var(--primary)}
.chip.drop-after{box-shadow:3px 0 0 var(--primary)}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;width:220px;display:flex;flex-direction:column}
.pop button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.pop button:hover{background:var(--surface-2)}
.pop .empty{font-size:12px;color:var(--muted);padding:8px 10px}

.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--primary-soft);border:1px solid var(--primary)}
.editbar p{margin:0;font-size:13px;min-width:0;flex:1 1 260px}
.editbar strong{color:var(--primary)}
.editbar .group{display:flex;gap:8px;flex-wrap:wrap}

.tip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px}
.tip p{margin:0;min-width:0;flex:1 1 260px}

/* blocks keep their own height: a short block next to a tall one no longer gets an empty band at the bottom */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.block{grid-column:span var(--w,6);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;position:relative;transition:box-shadow .15s,outline-color .15s}
.block[data-h="s"]{min-height:150px}.block[data-h="m"]{min-height:250px}.block[data-h="l"]{min-height:380px}
.block-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.block-head h2{font-size:15px;font-weight:700;flex:1;min-width:0}
.block-head .meta{font-size:12px;color:var(--muted)}
.collapse{border:0;background:transparent;padding:4px;border-radius:6px;color:var(--muted);display:none}
.block-body{padding:4px 14px 14px;min-width:0;flex:1}
.block.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:0 0 0 0 transparent}}

.editing-board .block{outline:2px dashed var(--input);outline-offset:-1px;cursor:grab;border-color:transparent}
.editing-board .block:hover{outline-color:var(--primary)}
.editing-board .block-body{pointer-events:none;opacity:.5;user-select:none}
.block.dragging{opacity:.35}
.block.drop-before{box-shadow:-5px 0 0 var(--primary)}
.block.drop-after{box-shadow:5px 0 0 var(--primary)}
.block.drop-above{box-shadow:0 -5px 0 var(--primary)}
.block.drop-below{box-shadow:0 5px 0 var(--primary)}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 8px}
.handle{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;width:30px;height:28px;display:grid;place-items:center;cursor:grab;padding:0}
.handle svg{width:14px;height:14px;color:var(--muted)}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mini button{border:0;background:var(--surface);padding:3px 8px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.mini button:last-child{border-right:0}
.mini button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.mini-label{font-size:11px;color:var(--muted);margin-left:4px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:28px;min-width:28px;display:inline-grid;place-items:center;padding:0 6px;color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--input)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn svg{width:15px;height:15px}
.tools .spacer{flex:1}

.confirm{margin:0 14px 10px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--fg);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex:1 1 220px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stat{flex:1 1 90px;padding:8px 10px;border-radius:8px;background:var(--surface-2);min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;line-height:1.3}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.stat.danger{background:var(--danger-soft)}.stat.danger .v{color:var(--danger)}
.stat.warn{background:var(--warn-soft)}.stat.warn .v{color:var(--warn)}
.stat.info{background:var(--info-soft)}.stat.info .v{color:var(--info)}
.stat.ok{background:var(--ok-soft)}.stat.ok .v{color:var(--ok)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.rows li:first-child{border-top:0}
.rows .main-t{flex:1;min-width:0}
.rows .sub{font-size:12px;color:var(--muted)}
.rows .end{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.rows .when{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:5.5em}
.num{font-weight:500;color:var(--fg)}
.pill{display:inline-block;font-size:11.5px;font-weight:500;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;min-width:0;border:1px solid var(--input);border-radius:8px;padding:7px 10px;background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cap{font-size:12px;color:var(--muted)}
.code{font-size:12px;color:var(--muted);margin-right:6px}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:4px 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.spark{width:100%;height:64px;display:block}
[hidden]{display:none!important}
/* ---- each card rearranges its own content to its own size (container queries) ----
   narrow card: fewer columns, actions on their own line; wide card: lists flow into columns */
.block{container-type:inline-size}
@container (max-width:460px){
  .block .today-bar .cap{display:none}
  .block .stat{padding:6px 8px;flex-basis:70px}
  .block .stat .v{font-size:17px}
  .block .rows li.trow{flex-wrap:wrap}
  .block .rows li.trow .end{width:100%;justify-content:space-between}
  .block .rows li.horow{grid-template-columns:minmax(0,1fr) auto}
  .block .rows li.horow .ho-n{grid-column:1 / -1}
  .block .rows li.horow .ho-due{grid-column:1;flex-direction:row;gap:6px;align-items:center}
  .block .week{grid-template-columns:repeat(7,64px);overflow-x:auto;padding-bottom:4px}
  .block .occ-sub{text-align:left}
  .block .selbar{flex-direction:column;align-items:stretch}
}
@container (min-width:700px){
  #blk-history .rows,#blk-vacancy .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
  #blk-history .rows li:nth-child(2),#blk-vacancy .rows li:nth-child(2){border-top:0}
  .block#blk-moveout .check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
  #blk-occupancy .block-body{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);grid-template-areas:"h c" "g c" "m m";gap:4px 20px;align-items:start}
  #blk-occupancy .occ-head{grid-area:h;flex-direction:column;align-items:flex-start}
  #blk-occupancy .occ-sub{text-align:left}
  #blk-occupancy .occ-grow{grid-area:g}
  #blk-occupancy .occ-chart{grid-area:c;max-height:170px}
  #blk-occupancy .occ-months{grid-area:m}
  #blk-occupancy .occ-ctl{grid-area:m}
}
@container (min-width:1000px){
  #blk-vacancy .rows{grid-template-columns:repeat(3,minmax(0,1fr))}
  #blk-vacancy .rows li:nth-child(3){border-top:0}
}
/* wide 管理台帳を探す: search box on the left, results flow in columns on the right */
#blk-search #search-results .rows{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;margin-top:4px}
#blk-search #search-results .rows li{flex:1 1 220px;max-width:340px;border:1px solid var(--line);border-top:1px solid var(--line);border-radius:8px;padding:8px 12px;align-items:center;background:var(--surface)}
#blk-search #search-results .rows li:hover{border-color:var(--primary)}
#blk-search #search-results .rows .code{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
#blk-search #search-results .cap{margin-top:10px}
.occ-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.occ-sub{font-size:12px;color:var(--muted);text-align:right}
.occ-grow{font-size:12px;color:var(--muted);margin:2px 0 0}
.occ-chart{width:100%;height:auto;display:block;max-height:150px}
.occ-months{display:flex;flex-wrap:wrap;width:100%}
.occ-months button{flex:1 1 0;padding:4px 0;font-size:12px}
/* 2026-10-19: 期間 chips + (longer periods) the shared month picker under the chart */
.occ-ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.occ-period{width:100%}
.occ-period button{flex:1 1 0;padding:4px 0;font-size:12px}
.occ-ctl .gk-mpw{align-items:stretch;width:100%}
.occ-ctl .gk-mp{width:100%}
.occ-ctl .gk-mp select{flex:1 1 auto}
.occ-note{margin:0;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.big{font-size:28px;font-weight:700;line-height:1.2}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.bar-row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.bar-row .bar{height:10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-row .bar span{display:block;height:100%;background:var(--primary);border-radius:4px}
.bar-row .bar span.warn{background:var(--warn)}
.bar-row .n{text-align:right;font-weight:500}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.note{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.note .sub{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.loan dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.loan dt{color:var(--muted)}
.loan dd{margin:0;text-align:right;font-weight:500}
.loan .result{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--primary-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.loan .result b{font-size:18px}
.link{border:0;background:transparent;color:var(--primary);padding:0;font-size:13px;margin-top:8px}
.sample-note{font-size:12px;color:var(--muted);margin:0}

/* rental-staff helpers */
.act{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.act:hover{color:var(--fg);border-color:var(--input)}
.act.ok{color:var(--ok);border-color:var(--ok)}
.act.ok:hover{background:var(--ok-soft)}
.task-act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.rows li.done .main-t{color:var(--muted);text-decoration:line-through}
.done-head{font-size:12px;color:var(--muted);margin-top:10px;padding-top:6px;border-top:1px dashed var(--line)}
.rowbtn{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;flex:1;min-width:0}
.rowbtn:hover .t1{color:var(--primary);text-decoration:underline}
.rows .end .t2{display:block}
.empty-ok{padding:14px 12px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:13px;margin:0}
.ho-warn{font-size:12px;color:var(--danger)}
.check{display:flex;flex-direction:column}
.check label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer;border-top:1px solid var(--line)}
.check label:first-child{border-top:0}
.check input,td input[type="checkbox"],.panel-body input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);margin:0;flex-shrink:0}
.check label.done span{color:var(--muted);text-decoration:line-through}
.mo-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.selbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.selbar .group{display:flex;gap:6px;flex-wrap:wrap}
.note{position:relative;padding-right:26px}
.note .del{position:absolute;top:4px;right:4px;border:0;background:transparent;color:var(--muted);padding:3px;border-radius:4px;display:grid;place-items:center}
.note .del:hover{color:var(--danger)}
.note .pill{margin-right:4px}
.note-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note-form input{flex:1 1 140px;min-width:0}
.note-form input,.note-form select,.field input,.field select,.field textarea{border:1px solid var(--input);border-radius:8px;padding:6px 10px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field textarea{resize:vertical;min-height:72px}
.tpls{display:flex;gap:6px;flex-wrap:wrap}
.err{font-size:12px;color:var(--danger);margin:0}
.panel-body{overflow:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:16px}
.panel-body h3{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin-bottom:6px}

/* 2026-10-19: every month from the earliest management start (GK.firstManagedMonth) to this month, from the ledger (GK.occAt:
   rooms of the properties managed at the month end, rooms with a lease running on the last day) — no demo history any more.
   OCC.list rows: [label 'M月' or 'YYYY年M月', rate, occupied, managed, what changed in the managed count, 'YYYY-MM']
   OCC.sel = the picked month ('YYYY-MM'); OCC.per = 期間 (6 / 12 / 24 / 0 = すべて), remembered per viewer in localStorage.
   Rebuilt by buildOcc() from buildData(), so it follows a save in another tab or a Back-button return (the picked month stays) */
var OCC_KEY='ganki-home-occ-period',OCC_PER=[[6,'半年'],[12,'1年'],[24,'2年'],[0,'すべて']];
var OCC={list:[],sel:'',per:6};
try{var op0=localStorage.getItem(OCC_KEY);if(op0!=null&&OCC_PER.some(function(p){return String(p[0])===op0}))OCC.per=+op0}catch(e){}
function occLabel(m){return (m.slice(0,4)!==GK.TODAY.slice(0,4)?(+m.slice(0,4))+'年':'')+(+m.slice(5,7))+'月'}
function buildOcc(){
 var c=GK.TODAY.slice(0,7),ms=GK.monthRange(GK.firstManagedMonth(),c);if(!ms.length)ms=[c];
 OCC.list=ms.map(function(m){
  var o=GK.occAt(m),note=o.added.map(function(a){return a.name+'（'+a.rooms+'室）の管理開始'}).concat(o.removed.map(function(a){return a.name+'（'+a.rooms+'室）の管理終了'})).join('、');
  return [occLabel(m),o.rate,o.occupied,o.rooms,note,m];
 });
 if(!OCC.list.some(function(x){return x[5]===OCC.sel}))OCC.sel=c;
}
/* the months shown for the chosen 期間 (the picked month moves into it when it falls outside) */
function occView(){var L=OCC.list,n=OCC.per>0?Math.min(OCC.per,L.length):L.length,V=L.slice(L.length-n);if(!V.some(function(x){return x[5]===OCC.sel}))OCC.sel=V[V.length-1][5];return V}
/* x labels: every month when there is room; otherwise every 2/3/6/12 months, then year boundaries only (「2025年1月」), never overlapping */
function occTicks(V,X,w){
 var tw=function(s){var n=0;for(var i=0;i<s.length;i++)n+=/[0-9]/.test(s[i])?6.4:11.5;return n};
 var txt=function(x,full){var m=x[5],mo=+m.slice(5,7);return full?GK.monthText(m):mo===1?(+m.slice(0,4))+'年1月':mo+'月'};
 /* a label at the edge is moved inward so it is never cut off */
 var at=function(k,ww){return Math.max(ww/2+1,Math.min(w-ww/2-1,X(k)))};
 var fits=function(list){var pl=[];for(var i=0;i<list.length;i++){var k=list[i],s=txt(V[k]),ww=tw(s),x=at(k,ww);for(var j=0;j<pl.length;j++)if(Math.abs(pl[j].x-x)<(pl[j].w+ww)/2+4)return null;pl.push({k:k,x:x,w:ww,s:s})}return pl};
 var steps=[1,2,3,6,12];
 for(var si=0;si<steps.length;si++){var st=steps[si],ks=[];V.forEach(function(x,k){var mo=+x[5].slice(5,7);if(st===1||(mo-1)%st===0)ks.push(k)});if(!ks.length)continue;var r=fits(ks);if(r)return r}
 /* long ranges: year boundaries from the newest back, skipping those that would overlap */
 var out=[];for(var k=V.length-1;k>=0;k--){if(+V[k][5].slice(5,7)!==1)continue;var s=txt(V[k]),ww=tw(s),x=at(k,ww);if(out.some(function(p){return Math.abs(p.x-x)<(p.w+ww)/2+4}))continue;out.push({k:k,x:x,w:ww,s:s})}
 if(!out.length){var k0=V.length-1,s0=txt(V[k0],true);out.push({k:k0,x:at(k0,tw(s0)),w:tw(s0),s:s0})}
 return out;
}
/* the vertical axis follows the data: rounded min/max with a little room above and below, 2-4 gridlines every 0.5/1/2/5/10… points
   (the points then always sit inside the plot, clear of the month labels underneath) */
function occAxis(vals){
  vals=vals.filter(function(v){return isFinite(v)});if(!vals.length)vals=[0];
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),pad=Math.max(0.5,(hi-lo)*0.15),a=lo-pad,b=hi+pad;
  var steps=[0.5,1,2,5,10,20,25,50],step=steps[steps.length-1];
  for(var i=0;i<steps.length;i++){if(Math.ceil(b/steps[i]-1e-9)-Math.floor(a/steps[i]+1e-9)<=4){step=steps[i];break}}
  var min=Math.floor(a/step+1e-9)*step,max=Math.ceil(b/step-1e-9)*step;
  if(max>100&&hi<=100)max=100;if(min<0)min=0;if(max<=min)max=min+step;
  var ticks=[];for(var t=min;t<=max+1e-9;t+=step)ticks.push(Math.round(t*10)/10);
  return {min:min,max:max,step:step,ticks:ticks};
}
function occBlock(){
  var e=GK.esc,V=occView(),L=OCC.list,gi=-1;L.forEach(function(x,k){if(x[5]===OCC.sel)gi=k});
  var i=-1;V.forEach(function(x,k){if(x[5]===OCC.sel)i=k});if(i<0){i=V.length-1;gi=L.length-1}
  var cur=V[i],v=+cur[1]||0,o=cur[2],rooms=cur[3],prev=gi>0?L[gi-1]:null;
  var diff=prev==null||!prev[3]?'':(v-prev[1]>=0?'+':'−')+Math.abs(v-prev[1]).toFixed(1)+'ポイント（前月比）';
  var grow=prev&&rooms!==prev[3]?'管理 '+(rooms-prev[3]>0?'+':'−')+Math.abs(rooms-prev[3])+'室'+(cur[4]?'：'+cur[4]:''):'管理の部屋数は前月と同じ';
  var w=320,h=110,pl=34,pr=12,pt=12,pb=26,n=V.length,many=n>24;
  var ax=occAxis(V.map(function(x){return x[1]})),min=ax.min,max=ax.max;
  var X=function(k){return n>1?pl+k*(w-pl-pr)/(n-1):(pl+w-pr)/2},Y=function(val){return pt+(max-val)/(max-min)*(h-pt-pb)};
  var f1=function(x){return (Math.round(x*10)/10).toFixed(1)};
  var grid=ax.ticks.map(function(g){var y=f1(Y(g));return '<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(+y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+(ax.step<1?g.toFixed(1):g)+'%</text>'}).join('');
  var line=V.map(function(x,k){return f1(X(k))+','+f1(Y(x[1]))}).join(' ');
  var ticks=occTicks(V,X,w),tk={};ticks.forEach(function(t){tk[t.k]=t});
  var full=function(x){return GK.monthText(x[5])};
  var hitW=n>1?(w-pl-pr)/(n-1):40;
  var dots=V.map(function(x,k){var on=k===i,cx=f1(X(k)),cy=f1(Y(x[1])),t=tk[k];
    var g='<g><title>'+e(full(x))+'末 '+x[1]+'%（入居 '+x[2]+' / 管理 '+x[3]+'室）</title>'+(on?'<line x1="'+cx+'" x2="'+cx+'" y1="'+pt+'" y2="'+(h-pb)+'" stroke="var(--primary)" stroke-opacity=".25" stroke-width="1"/>':'');
    if(!many||on)g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(on?6:4)+'" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>';
    g+=many?'<rect x="'+f1(Math.max(0,X(k)-hitW/2))+'" y="'+pt+'" width="'+f1(Math.max(1,hitW))+'" height="'+(h-pt-pb)+'" fill="transparent" data-occm="'+x[5]+'" style="cursor:pointer"/>':'<circle cx="'+cx+'" cy="'+cy+'" r="12" fill="transparent" data-occm="'+x[5]+'" style="cursor:pointer"/>';
    if(t)g+='<text x="'+f1(t.x)+'" y="'+(h-8)+'" text-anchor="middle" font-size="11" fill="'+(on?'var(--fg)':'var(--muted)')+'" font-weight="'+(on?700:400)+'">'+e(t.s)+'</text>';
    return g+'</g>'}).join('');
  var aria;
  if(!many)aria='月末の入居率 '+V.map(function(x){return full(x)+' '+x[1]+'%'}).join('、');
  else{var lo=V[0],hi=V[0];V.forEach(function(x){if(x[1]<lo[1])lo=x;if(x[1]>hi[1])hi=x});
    aria='月末の入居率 '+full(V[0])+'〜'+full(V[n-1])+'（'+n+'か月）。最低 '+full(lo)+' '+lo[1]+'%、最高 '+full(hi)+' '+hi[1]+'%、'+full(cur)+'（選んだ月） '+cur[1]+'%'}
  var per='<div class="seg occ-period" role="group" aria-label="グラフの期間">'+OCC_PER.map(function(p){var on=OCC.per===p[0];return '<button type="button" data-occp="'+p[0]+'" aria-pressed="'+on+'">'+p[1]+'</button>'}).join('')+'</div>';
  var pick=n<=6?'<div class="seg occ-months" role="group" aria-label="月を選ぶ">'+V.map(function(x,k){return '<button type="button" data-occm="'+x[5]+'" aria-pressed="'+(k===i)+'" aria-label="'+e(full(x))+'" title="'+e(full(x))+'">'+(+x[5].slice(5,7))+'月</button>'}).join('')+'</div>'
    :GK.monthPicker.html({id:'occMonth',months:V.map(function(x){return x[5]}),value:cur[5],group:'月を選ぶ',cls:'occ-pick'});
  return '<div class="occ-head"><div class="big">'+v.toFixed(1)+'%<small>入居 '+o+' / 管理 '+rooms+'室</small></div><div class="occ-sub">'+e(full(cur))+'末の入居率'+(diff?'<br>'+diff:'')+'</div></div>'+
    '<p class="occ-grow">'+e(prev?grow:'管理 '+rooms+'室（台帳でいちばん古い月）')+'</p>'+
    '<svg class="occ-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+e(aria)+'">'+grid+'<polyline points="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>'+
    '<div class="occ-ctl">'+per+pick+'<p class="occ-note">台帳から計算（'+e(GK.monthText(L[0][5]))+'〜・月末に契約中の部屋 ÷ 管理している部屋）</p></div>';
}

/* the handover block sits beside 「これからの契約更新」: keep both the same height and let the handover list scroll inside */
function fitHandover(){
  var h=document.getElementById('blk-handover'),list=h&&h.querySelector('#ho-list');if(!list)return;
  list.style.maxHeight='';list.style.overflow='';
  if(S.editing||isPhone())return;
  var top=Math.round(h.getBoundingClientRect().top),other=[].filter.call(document.querySelectorAll('#board .block'),function(b){return b!==h&&Math.abs(Math.round(b.getBoundingClientRect().top)-top)<2});
  if(!other.length)return;
  var target=Math.max.apply(null,other.map(function(b){return b.getBoundingClientRect().height})),hh=h.getBoundingClientRect().height;
  if(hh<=target+1)return;
  var room=list.getBoundingClientRect().height-(hh-target);
  list.style.maxHeight=Math.max(160,Math.floor(room))+'px';list.style.overflow='auto';
}

function spark(vals,min,max){
  var w=300,h=64,p=6,n=vals.length;
  var pts=vals.map(function(v,i){return [p+i*(w-2*p)/(n-1), h-p-(v-min)/(max-min)*(h-2*p)]});
  var line=pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(h-p)+' L'+line.split(' ').join(' L')+' L'+pts[n-1][0].toFixed(1)+','+(h-p)+' Z';
  var last=pts[n-1];
  var grid=[0.25,0.5,0.75].map(function(f){var y=(p+f*(h-2*p)).toFixed(1);return '<line x1="'+p+'" x2="'+(w-p)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>'}).join('');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+grid+'<path d="'+area+'" fill="var(--primary-soft)"/><polyline points="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="var(--primary)"/></svg>';
}

/* ---------- rental-staff helpers ----------
   Rooms, tenants, contracts, arrears, tasks, history and renewals come from the shared demo store (GK.db in ganki-data.js),
   so what you do here also shows on the other pages. Only the handover block, memos and the move-out checklist stay on this page. */
function esc(s){return GK.esc(s)}
var ROOMS={},PAST={},NEXT={},PROPS={};
function guaLabel(g){return g?'あり（'+g+'）':'なし'}
function buildData(){
  ROOMS={};PAST={};NEXT={};PROPS={};
  GK.db.props.forEach(function(p){
    var o=GK.owner(p.owner),s=GK.parse(p.since);
    PROPS[p.n]={code:p.id,addr:p.addr,type:p.type,units:(p.rooms||[]).length,owner:o?o.n+' 様':'',ownerId:o?o.id:'',ownerName:o?o.n:'',ownerTel:o?o.tel:'',since:s?s.getFullYear()+'年'+(s.getMonth()+1)+'月':''};
  });
  GK.db.units.forEach(function(u){
    var p=GK.prop(u.prop);if(!p)return;
    var a=GK.activeLease(u.id),t=a&&GK.tenant(a.tenant),st=GK.unitStatus(u);
    var ar=a?GK.arrears(a.id).map(function(c){return (+c.month.slice(5))+'月分 家賃 '+GK.yen(c.amount-(c.paid||0))+'（'+GK.overdueDays(c.due)+'日）'}).join('、'):'';
    var term=a?(a.notice?GK.sd(a.notice.date)+' 退去予定（契約 '+(a.startUnknown?'始まり 確認中':GK.jp(a.start)+'〜')+'）':termText(a)+(a.renewal==='更新済み'?'（更新済み）':'')):'空室（'+st+'）';
    ROOMS[u.id]={p:p.n,n:u.no,lay:u.lay||'',area:u.area||0,rent:+(a?a.rent:u.rent)||0,ten:t?t.n+' 様':'',tid:t?t.id:'',tel:t?t.tel:'',gua:a?guaLabel(a.gua):'—',term:term,ar:ar,lease:a?a.id:'',st:st};
  });
  GK.db.leases.forEach(function(l){
    var t=GK.tenant(l.tenant);if(!t)return;
    if(l.status==='終了'){var m=l.moveout||{};(PAST[l.unit]=PAST[l.unit]||[]).push({n:t.n+' 様',t:termText(l),why:m.reason||'退去',set:m.settle?'敷金：'+m.settle:'',end:l.end,lid:l.id})}
    else if(l.status==='申込中'||l.status==='入居予定')NEXT[l.unit]={n:t.n+' 様',t:GK.sd(l.start)+' 入居予定',st:l.status==='申込中'?'申込あり・審査中':'入居予定',start:l.start};
  });
  Object.keys(PAST).forEach(function(k){PAST[k].sort(function(a,b){return a.end<b.end?1:-1})});
  GK.db.leases.forEach(function(l){if(l.status==='有効'&&l.notice&&!NEXT[l.unit])NEXT[l.unit]={n:'',t:GK.sd(l.notice.date)+' 退去後に募集',st:'募集準備'}});
  buildOcc();
}
/* contract term in words: a takeover lease may not know its start (startUnknown) or its end yet (endUnknown = provisional end) */
function termText(l){
  var s=l.startUnknown||!l.start?'始まり 確認中 ':GK.jp(l.start),e=l.end?GK.jp(l.end)+(l.endUnknown?'（仮）':''):'未登録';
  return s+'〜'+e;
}
buildData();
/* managed buildings only (takeovers in progress are not in 物件・台帳 yet; they are listed in the 管理の引継ぎ block) */
function propNames(){return Object.keys(PROPS)}
function rl(k){if(!k)return '部屋なし';var R=ROOMS[k];return R?R.p+' '+R.n:GK.roomLabel(k)}
function code(k){return String(k).split('-').slice(0,2).join('-')}
function nowHM(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
/* 「元に戻す」 reverses only this page's own change, found again by id in the current GK.db
   (GK.db may have been replaced by a save in another tab; whole arrays are never put back, so other tabs' changes survive) */
function logIt(t,unit){
  GK.log(t,unit);
  var l=GK.db.log[0]||{},h=unit?GK.db.hist[0]:null;
  return {at:l.at,t:l.t,unit:unit||'',hid:h&&h.t===t?h.id:''};
}
function unlog(recs){
  var d=GK.db;
  (recs||[]).forEach(function(r){
    if(!r)return;
    if(Array.isArray(d.log))for(var i=0;i<d.log.length;i++){var x=d.log[i];if(x&&x.at===r.at&&x.t===r.t&&(x.unit||'')===r.unit){d.log.splice(i,1);break}}
    if(r.hid&&Array.isArray(d.hist))for(var j=0;j<d.hist.length;j++){var y=d.hist[j];if(y&&y.id===r.hid&&y.t===r.t&&y.unit===r.unit){d.hist.splice(j,1);break}}
  });
}
/* the fields of a record as they were (absent fields stay absent when put back) */
function keep(o,fields){var s={};fields.forEach(function(f){s[f]=Object.prototype.hasOwnProperty.call(o,f)?{v:JSON.parse(JSON.stringify(o[f]===undefined?null:o[f]))}:null});return s}
function putBack(o,s){if(!o)return;Object.keys(s).forEach(function(f){if(s[f])o[f]=s[f].v;else delete o[f]})}
function dropTasks(ids){if(ids.length)GK.db.tasks=GK.db.tasks.filter(function(x){return ids.indexOf(x.id)<0})}
/* ---------- tasks (GK.db.tasks: {id,unit,t,due,who,done}) ---------- */
function taskBy(id){return GK.by(GK.db.tasks,id)}
function isOut(x){return x.kind==='out'||/退去/.test(x.t||'')}
/* kind is worked out from the date every time, so 「明日へ」 or a new task never needs a manual label */
/* 'later' = due after the next 7 days: not on 今日確認すること (it shows in 今週の予定 / the room panel when its day comes) */
function kindOf(x){if(x.due&&x.due<T)return 'over';if(x.due===T)return 'today';if(x.due&&x.due>rel(7))return 'later';if(isOut(x))return 'out';return 'soon'}
function taskTime(x){if(x.time)return x.time;if(isOut(x)){var a=GK.activeLease(x.unit);if(a&&a.notice&&a.notice.insp&&a.notice.insp.slice(0,10)===x.due)return a.notice.insp.slice(11,16)}return ''}
function dueText(x){var tm=taskTime(x),k=kindOf(x);if(k==='over')return GK.sd(x.due)+' 期限';return (x.due===T?'今日':x.due===rel(1)?'明日 '+GK.sd(x.due):GK.sdw(x.due))+(tm?' '+tm:'')}
function cmpDue(a,b){return a.due<b.due?-1:a.due>b.due?1:(taskTime(a)||'99')<(taskTime(b)||'99')?-1:1}
/* appointments (a set time with someone: 退去立会い 10:30, 内見 …) are moved with 「日程を変える」, never 「明日へ」 */
function isAppt(x){
  if(typeof GK.fixedTime==='function'){try{return !!GK.fixedTime(x)}catch(e){}}
  return /\d{1,2}:\d{2}/.test((x.t||'')+' '+dueText(x))||/^(退去立会い|内見|立会い)/.test(x.t||'');
}
function apptTime(x){var tm=taskTime(x);if(tm)return tm;var m=/(\d{1,2}):(\d{2})/.exec(x.t||'');return m?('0'+m[1]).slice(-2)+':'+m[2]:''}
/* 「退去立会い（10/18 10:30）」 -> 「退去立会い」 */
function apptBase(x){return String(x.t||'').replace(/\s*（[^）]*\d{1,2}[\/:]\d{1,2}[^）]*）\s*$/,'')||String(x.t||'')}
function apptLabel(d,tm){return GK.sd(d)+(tm?' '+tm:'')}
/* the lease whose 立会い date this task is (notice.insp moves with it) */
function apptLease(x){var a=GK.activeLease(x.unit);return a&&a.notice&&a.notice.insp&&/立会い/.test(x.t||'')?a:null}
function rsForm(x){
  var tm=apptTime(x),d=x.due&&x.due>=T?x.due:T,l=apptLease(x);
  return '<li class="rs-row"><form class="rs-form" id="rs-form" data-task="'+esc(x.id)+'" novalidate aria-label="「'+esc(x.t)+'」の日程を変える">'+
    '<div class="field"><label for="rs-date">新しい日付</label><input type="date" id="rs-date" min="'+T+'"'+(l&&l.notice.date?' max="'+esc(l.notice.date)+'"':'')+' value="'+esc(d)+'" required aria-describedby="rs-err"></div>'+
    '<div class="field"><label for="rs-time">時刻</label><input type="time" id="rs-time" value="'+esc(tm)+'" aria-describedby="rs-err"></div>'+
    '<label class="chk"><input type="checkbox" id="rs-told" checked>入居者に連絡した</label>'+
    '<span class="group"><button class="btn primary" type="submit">変更する</button><button class="btn" type="button" data-rscancel="'+esc(x.id)+'">やめる</button></span>'+
    '<p class="err" id="rs-err" role="alert" hidden></p>'+
    '<p class="cap" style="flex-basis:100%;margin:0">今の予定：'+esc(apptLabel(x.due,tm))+(l?' · 退去日 '+esc(GK.sd(l.notice.date))+'（立会いは退去日までに）':'')+' · Esc でやめる</p></form></li>';
}
/* only the to-dos this person may see: a private (自分だけ) to-do belongs to its creator alone, so every list and count below skips it for others */
function visTasks(){return typeof GK.visibleTasks==='function'?GK.visibleTasks():GK.db.tasks.filter(function(x){return x&&!x.private})}
function openTasks(){return visTasks().filter(function(x){return !x.done})}
/* what 今日確認すること lists and counts (the greeting uses the same set, so the numbers agree) */
/* 滞納の段階 (2026-10-19; GK.dun in ganki-data.js): one row per contract with unpaid rent — its current step, worked out from the
   charges each time (never stored as a to-do, so it is never duplicated and always up to date). 済み moves it to the next step. */
function dunOn(){return !!(GK.dun&&GK.can('money.dunning'))}
function dunStates(){if(!dunOn())return [];try{return GK.dun.list()}catch(e){if(window.console)console.error(e);return []}}
function dunRows(){return dunStates().filter(function(s){return s.step>0}).map(function(s){return {id:'dun-'+s.lease,dun:s,unit:s.unit,t:s.text,due:s.due,who:s.who}})}
function todayTasks(){return openTasks().concat(dunRows()).filter(function(x){return kindOf(x)!=='later'})}
function doneTasks(){return visTasks().filter(function(x){return x.done&&(!x.doneAt||x.doneAt===T)})}
function cnt(k){return openTasks().concat(dunRows()).filter(function(x){return kindOf(x)===k}).length}
function meOnly(x){return x&&x.private?'<span class="pill me-only">自分だけ</span>':''}
/* a to-do without a room (unit '') is not a button: there is no room to open, and no room-only action is drawn for it */
function roomBtn(k,title,who,x){
  var sub=(k?esc(rl(k)):'<span class="noroom">部屋なし</span>')+meOnly(x)+(who?'<span class="who'+(who===ME?' me':'')+'">担当 '+(who===ME?'自分':esc(who))+'</span>':'');
  if(!k)return '<span class="main-t"><span class="t1">'+esc(title)+'</span><div class="sub">'+sub+'</div></span>';
  return '<button type="button" class="rowbtn" data-room="'+esc(k)+'"><span class="t1">'+esc(title)+'</span><div class="sub">'+sub+'</div></button>'}
/* ---------- history (GK.db.hist) ---------- */
/* 「発信」 pill on 電話（発信） entries (GK.callPill in ganki-data.js) */
function callMark(t){return typeof GK.callPill==='function'?GK.callPill(t):''}
function whenLabel(at){var d=String(at||'').slice(0,10),tm=String(at||'').slice(11,16);return d===T?'今日 '+tm:d===rel(-1)?'昨日 '+tm:GK.sd(d)}
function allHist(){
  return GK.db.hist.map(function(x){return {at:x.at,w:whenLabel(x.at),t:x.t,room:x.unit,who:x.who}})
    .sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0});
}
/* ---------- renewals: not yet sent (GK.renewalsDue) + those already in progress ---------- */
function renList(){
  var lim=GK.addDays(T,GK.db.prefs.notifyDays||90);
  var due=GK.renewalsDue().map(function(l){return {room:l.unit,end:l.end,st:'未案内',lease:l.id}});
  var other=GK.db.leases.filter(function(l){return l.status==='有効'&&!l.notice&&l.renewal&&l.renewal!=='更新済み'&&l.end<=lim}).map(function(l){return {room:l.unit,end:l.end,st:l.renewal,lease:l.id}});
  return due.concat(other).sort(function(a,b){return a.end<b.end?-1:a.end>b.end?1:0});
}
function letterDue(end){var d=GK.addDays(T,21),lim=GK.addDays(end,-30);if(lim<d)d=lim;if(d<GK.addDays(T,7))d=GK.addDays(T,7);return d}
function moLeases(){return GK.db.leases.filter(function(l){return l.status==='有効'&&l.notice}).sort(function(a,b){return a.notice.date<b.notice.date?-1:1})}
var D={
  mine:false,day:T,recent:[],msg:{},sel:{},
  mo:null,resched:null,
  q:'',shown:{},shownOwner:{}
};
/* memos live in the shared store (GK.db.memos: [{t,s}]); a store without the key gets the two sample memos (saved on the first change) */
function memos(){
  if(!Array.isArray(GK.db.memos))GK.db.memos=GK.LOCAL?[]:[{id:'m1',t:'山本オーナーへ折り返し（'+GK.sd(T)+' 午前）',s:'個人'},{id:'m2',t:'桜台の植栽、見積もり待ち',s:'共有'}];
  /* each memo gets an id (older ones by position) so delete / undo find the same memo after another tab's save */
  GK.db.memos.forEach(function(x,i){if(x&&typeof x==='object'&&!x.id)x.id='m'+(i+1)});

  if(td.due<T)return tdErr('td-due','今日（'+GK.sd(T)+'）より前の日付にはできません。');

  D.td=null;if(kindOf(k)!=='later'&&D.kf&&D.kf!==kindOf(k))D.kf='';render();

    if(st.gone){var cur=memos();if(!cur.some(function(x){return x&&x.id===st.gone.m.id}))cur.splice(Math.min(st.gone.i,cur.length),0,st.gone.m)}
    if(GK.closeConfirm)GK.closeConfirm();GK.save();
  };
  var msg='やることを追加しました'+(priv?'（自分だけ）':'')+(kindOf(k)==='later'?'。8日以降の期限なので、今週の予定・部屋の画面に出ます':'');
  toast(msg,back);
  if(memoId&&GK.can('act.memo')&&typeof GK.confirmBar==='function'){

    if(btn)btn.focus();

      var ns=memos(),ni=-1;ns.forEach(function(x,j){if(ni<0&&x&&x.id===memoId)ni=j});if(ni<0)return;
      st.gone={i:ni,m:ns.splice(ni,1)[0]};GK.save();renderBoard();

      var b2=document.querySelector('[data-tdopen]')||$('#note-text');if(b2)b2.focus();
    },{noLabel:'残す'});
  }else{
    var r=memoId?'[data-memotodo="'+memoId+'"]':'[data-tdopen]';refocusSel(r);
  }
}

/* ---------- 管理の引継ぎ: built only from GK.db.takeovers (takeover.html), via the GK.takeover* helpers ---------- */
var TO_STEPS=['物件とオーナー','受け取る書類','部屋と入居者','お知らせ','確認して登録'];
var HOF=[['','進行中'],['soon','期限7日以内'],['unknown','保証会社 確認中'],['miss','書類不足'],['done','完了']];
function toList(){
  var L=typeof GK.takeovers==='function'?GK.takeovers():GK.db.takeovers;
  return (Array.isArray(L)?L:[]).filter(function(t){return t&&typeof t==='object'&&t.id});
}
function toStep(t){return Math.max(0,Math.min(4,+t.step||0))}
function toNext(t){
  if(typeof GK.takeoverNext==='function'){try{var n=GK.takeoverNext(t);if(n)return n}catch(e){}}
  return {label:t.done?'引継ぎ完了':TO_STEPS[toStep(t)],due:t.start||'',step:t.done?5:toStep(t),done:!!t.done};
}
function toRooms(t){
  if(typeof GK.takeoverRooms==='function'){try{var r=GK.takeoverRooms(t);if(r)return r}catch(e){}}
  var rs=(t.rooms||[]).filter(function(x){return x&&String(x.no||'').trim()});
  return {rooms:rs.length,occupied:0,vacant:0,yes:0,no:0,unknown:rs.filter(function(x){return String(x.ten||'').trim()&&x.gua!=='あり'&&x.gua!=='なし'}).length};
}
/* documents still to receive (counted once the documents step has been reached; the 保証会社 document only when a room may have one) */
function toMiss(t){
  if(toStep(t)<1||!Array.isArray(t.docs))return 0;
  var R=toRooms(t),needG=!(R.occupied>0&&R.yes===0&&R.unknown===0);
  return t.docs.filter(function(d){return Array.isArray(d)&&!d[1]&&(needG||!/^保証会社の契約書/.test(String(d[0]||'')))}).length;
}

function hoMatch(t,f){
  if(f==='done')return !!t.done;
  if(t.done)return false;
  if(f==='soon')return daysLeft(toDue(t))<=7;
  if(f==='unknown')return toRooms(t).unknown>0;
  if(f==='miss')return toMiss(t)>0;
  return true;
}
function toOpen(){return toList().filter(function(t){return !t.done})}
function toHref(t){return 'takeover.html#to-'+encodeURIComponent(t.id)}
/* a finished takeover is a managed building: open its first room in 物件・台帳 */
function toLedger(t){
  if(!t.propId)return '';
  var u=GK.db.units.filter(function(x){return x.prop===t.propId})[0];
  if(u)return 'properties.html#room-'+u.id;
  var r=(t.rooms||[]).filter(function(x){return x&&String(x.no||'').trim()})[0];
  return 'properties.html'+(r?'#room-'+t.propId+'-'+String(r.no).trim():'');
}
function hoList(){
  var q=(D.hoq||'').trim(),f=D.hof||'';
  var list=toList().filter(function(t){return hoMatch(t,f)&&GK.hit(q,[t.name||'',toNext(t).label,(t.prev&&t.prev.n)||'',(t.prop&&t.prop.addr)||''])})
    .sort(function(a,b){return f==='done'?((a.doneAt||'')<(b.doneAt||'')?1:-1):daysLeft(toDue(a))-daysLeft(toDue(b))});
  D.hoCount=list.length;
  var it=S.layout.b.filter(function(x){return x.id==='handover'})[0],lim={s:3,m:5,l:10}[it?it.h:'m'];
  var row=function(t){
    var nx=toNext(t),st=t.done?5:toStep(t),R=toRooms(t),miss=toMiss(t),href=toHref(t),nm=t.name||'（物件名まだ）';
    var bars='<span class="msteps" role="img" aria-label="'+(t.done?'5 / 5 手順完了':'手順 '+(st+1)+' / 5：'+TO_STEPS[st])+'" title="'+(t.done?'引継ぎ完了':'手順 '+(st+1)+'/5：'+TO_STEPS[st])+'">'+TO_STEPS.map(function(s,j){return '<i class="'+(j<st?'on':j===st?'cur':'')+'"></i>'}).join('')+'</span>';
    var warn=t.done?'':(miss?'<span class="ho-warn">受け取っていない書類 '+miss+'件</span>':'')+(R.unknown?'<span class="ho-warn">保証会社 確認中 '+R.unknown+'室</span>':'');
    var ledger=t.done?toLedger(t):'';
    return '<li class="horow"><a class="rowbtn ho-name" href="'+href+'"><span class="t1">'+hl(nm,D.hoq)+'</span><div class="sub">'+R.rooms+'室 · 管理開始 '+(t.start?GK.sd(t.start):'未定')+'</div></a>'+bars+
      '<span class="ho-n">'+(t.done?'<span><span class="pill ok">引継ぎ完了</span>'+(t.doneAt?' <span class="cap">'+GK.sd(t.doneAt)+' 登録</span>':'')+'</span>':'<span>次：'+hl(nx.label,D.hoq)+'</span>')+warn+'</span>'+
      '<span class="ho-due">'+(t.done?'':nx.due?leftPill(nx.due)+'<span class="cap" title="入居者へのお知らせを送る日（それまでに準備をそろえます）">期限 '+GK.sd(nx.due)+'</span>':'')+'</span>'+
      (t.done?(ledger?'<a class="act" href="'+esc(ledger)+'">物件・台帳で見る</a>':'<span></span>'):'<a class="act ok" href="'+href+'" aria-label="「'+esc(nm)+'」の引継ぎを続きから">続きから</a>')+'</li>';
  };
  if(!list.length)return '<p class="sample-note" style="padding:10px 0">'+(q?'「'+esc(D.hoq)+'」に一致する物件はありません。':f==='done'?'完了した引継ぎはまだありません。':f?'該当する物件はありません。':'引継ぎ中の物件はありません')+'</p>';
  var h='';
  if(D.hoAll||q||list.length<=lim)h+=(list.length>lim?'<div class="scroll-list" tabindex="0" aria-label="引継ぎの物件（'+list.length+'件）">':'')+'<ul class="rows">'+list.map(row).join('')+'</ul>'+(list.length>lim?'</div>':'')+(D.hoAll&&!q&&list.length>lim?'<div class="more"><button class="act" type="button" data-homore="0">たたむ</button></div>':'');
  else h+='<ul class="rows">'+list.slice(0,lim).map(row).join('')+'</ul><div class="more"><button class="act" type="button" data-homore="1">ほか '+(list.length-lim)+'物件を表示</button><span class="cap">期限の近い順に表示中</span></div>';
  return h;
}

var KEY='ganki-home-mock-v5:'; /* v5: 今日確認すること comes first; quick actions renamed */
function def(role){var d=DEFAULTS[role];return {b:d.b.map(function(x){return {id:x[0],w:x[1],h:x[2],c:false}}),a:d.a.filter(function(k){return ACTIONS[k]})}}
function valid(o){return o&&Array.isArray(o.b)&&Array.isArray(o.a)&&o.b.every(function(x){return x&&BLOCKS[x.id]})&&o.a.every(function(x){return ACTIONS[x]})}
function load(role){try{var s=localStorage.getItem(KEY+role);if(s){var o=JSON.parse(s);if(valid(o))return addMoney(role,o)}}catch(e){}return def(role)}
/* a layout saved before the 入出金の確認 block existed gets it once, after 今日確認すること / 空室 (the storage key stays v5;
   a block the person hides later stays hidden: the flag below is set the first time) */
function addMoney(role,o){
  try{
    var fk=KEY+'money-added:'+role;
    if(localStorage.getItem(fk)==='1')return o;
    localStorage.setItem(fk,'1');
    if(!DEFAULTS[role]||!DEFAULTS[role].b.some(function(x){return x[0]==='money'})||o.b.some(function(x){return x.id==='money'}))return o;
    var at=-1;o.b.forEach(function(x,i){if(x.id==='today'||x.id==='vacancy')at=i});
    o.b.splice(at+1,0,{id:'money',w:12,h:'s',c:false});
    localStorage.setItem(KEY+role,JSON.stringify(o));
  }catch(e){}
  return o;
}

document.addEventListener('click',function(e){

  var d=t.dataset;
  if(d.role){if(!S.editing&&d.role!==S.role){S.role=d.role;S.layout=load(d.role);S.addAction=false;render();toast(ROLES[d.role].name+'の配置に切り替えました')}return}

  if(t.id==='addChip'){S.addAction=!S.addAction;renderQuick();var p=document.querySelector('[data-addchip]');if(p)p.focus();return}
  if(d.addchip){push();S.layout.a.push(d.addchip);S.addAction=false;render();return}
  if(d.rmchip){push();S.layout.a=S.layout.a.filter(function(x){return x!==d.rmchip});render();return}
  if(d.w)return setW(d.for,+d.w);
  if(d.h)return setH(d.for,d.h);
  if(d.move)return moveVis(d.for,+d.move);
  if(d.hide){if(BLOCKS[d.hide].important){S.confirmHide=d.hide;renderBoard();var ok=document.querySelector('[data-hideok]');if(ok)ok.focus()}else hide(d.hide);return}
  if(d.hideok)return hide(d.hideok);
  if(d.hideno){S.confirmHide=null;renderBoard();return}
  if(d.collapse){var i=idx(d.collapse);S.layout.b[i].c=!S.layout.b[i].c;if(!S.editing)store(S.role,S.layout);renderBoard();return}
  if(d.closepanel)return closePanel();
  if(d.roomnav)return moveRoom(+d.roomnav);
  if(d.room)return openRoom(d.room);
  if(d.log)return openLog(d.log);
  if(d.tdopen){if(D.td&&D.td.from==='today')return tdClose();return tdOpen('today',null,'[data-tdopen]')}
  if(d.memotodo){
    if(!GK.can('act.memotodo')||!GK.can('act.addtask'))return;
    if(D.td&&D.td.memo===d.memotodo)return tdClose();
    var mm=memos().filter(function(x){return x&&x.id===d.memotodo})[0];if(!mm)return;
    return tdOpen('memo',{memo:mm.id,memoS:mm.s,t:String(mm.t||'')},'[data-memotodo="'+mm.id+'"]');
  }
  if(d.tdcancel)return tdClose();
  if(d.tddue&&D.td){D.td.due=d.tddue;D.td.err=null;tdRender('');refocusSel('[data-tddue="'+d.tddue+'"]');return}
  if(d.tdroom&&D.td){if(!ROOMS[d.tdroom])return;D.td.unit=d.tdroom;D.td.uq='';D.td.err=null;if(!D.td.privSet)D.td.priv=false;tdRender('td-roomclear');return}
  if(d.tdroomclear&&D.td){D.td.unit='';D.td.uq='';if(!D.td.privSet)D.td.priv=true;tdRender('td-uq');return}
  if(d.dunskip){
    /* 滞納の段階: skip this step for this contract (4〜6; logged; undo) */
    if(!GK.dun||!GK.can('act.dunning'))return;
    var sk=GK.dun.skip(d.dunskip,{step:d.step});
    if(!sk.ok){render();toast(sk.msg);return}
    render();toast('「'+sk.label+'」を飛ばしました',sk.undo);return;
  }
  if(d.dundone){
    /* 滞納の段階: this step 済み (GK.dun keeps who / when; undo removes only that step and its log line) */
    if(!GK.dun||!GK.can('act.dunning'))return;

  var r=c.getBoundingClientRect(),after=e.clientX>=r.left+r.width/2;
  push();var a=S.layout.a.filter(function(x){return x!==id});var to=a.indexOf(c.dataset.chip)+(after?1:0);a.splice(to,0,id);S.layout.a=a;render();
});
quick.addEventListener('dragend',function(){S.dragChip=null;clearDrop()});

/* ---------- Ctrl+K palette ---------- */
var P={open:false,sel:0,items:[],ret:null};
function palItems(q){
  q=(q||'').trim().toLowerCase();
  var out=[];
  function m(s){return !q||s.toLowerCase().indexOf(q)>=0}
  Object.keys(ACTIONS).forEach(function(k){if(actionOk(k)&&m(ACTIONS[k]))out.push({g:'操作',l:ACTIONS[k],s:ACTION_PAGES[k]?'ページを開く':'開く',run:function(){runAction(k)}})});
  if(m('使い方 ヘルプ 近道 ショートカット'))out.push({g:'操作',l:'使い方を見る',s:'開く',run:openHelp});
  shownBlocks().forEach(function(it){var B=BLOCKS[it.id];if(m(B.t))out.push({g:'このホームのブロック',l:B.t,s:'移動',run:function(){flash(it.id)}})});
  propNames().forEach(function(n){if(m(n))out.push({g:'物件',l:n,s:'物件の詳細を開く',run:function(){openProp(n)}})});
  searchHits(q).slice(0,q?30:8).forEach(function(k){var R=ROOMS[k];out.push({g:'部屋',l:R.p+' '+R.n+(R.ten?'　'+R.ten:''),s:'部屋の情報を開く',run:function(){openRoom(k)}})});
  /* じょのじょ (ganki-jonojo.js): ask the typed words as a question (or just open it) */
  if(GK.jono&&GK.can('in.jono')){var jq=($('#pal-q')||{}).value||'',jn=GK.jono.name(),jt=String(jq).trim();
    out.push({g:jn,l:jt?jn+'に聞く：「'+jt.slice(0,40)+'」':jn+'に聞く',s:'使い方を聞く',run:function(){GK.jono.open({ret:P.ret,unhide:true,q:jt&&!/^(じょのじょ|ジョノジョ)$/.test(jt)?jt:''})}})}
  return out;
}
function openPal(){if(P.open||!GK.can('in.palette'))return;P.open=true;P.sel=0;P.ret=document.activeElement;
  $('#palette').innerHTML='<div class="pal" data-palbg="1"><div class="pal-box" role="dialog" aria-modal="true" aria-label="探す・移動"><input id="pal-q" type="text" role="combobox" aria-label="物件名・操作名・ブロック名で探す" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" placeholder="物件名・操作名・ブロック名を入力" autocomplete="off"><div class="pal-list" id="pal-list" role="listbox"></div><div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 選ぶ</span><span><kbd>Enter</kbd> 開く</span><span><kbd>Esc</kbd> 閉じる</span></div></div></div>';
  var inp=$('#pal-q');inp.addEventListener('input',function(){P.sel=0;palList()});inp.addEventListener('keydown',palKey);
  $('#palette .pal').addEventListener('mousedown',function(e){if(e.target.dataset.palbg)closePal()});
  palList();inp.focus();
}
function palList(){
  P.items=palItems($('#pal-q').value);var h='',g='';
  if(!P.items.length)h='<div class="pal-group">見つかりませんでした。別の言葉で探してください。</div>';
  P.items.forEach(function(it,i){if(it.g!==g){g=it.g;h+='<div class="pal-group">'+esc(g)+'</div>'}h+='<button type="button" class="pal-item" role="option" id="pal-'+i+'" data-pal="'+i+'" aria-selected="'+(i===P.sel)+'"><span>'+esc(it.l)+'</span><span>'+esc(it.s)+'</span></button>'});
  var L=$('#pal-list');L.innerHTML=h;
  $('#pal-q').setAttribute('aria-activedescendant',P.items.length?'pal-'+P.sel:'');
  var s=L.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:'nearest'});
  L.querySelectorAll('[data-pal]').forEach(function(b){b.addEventListener('click',function(){runPal(+b.dataset.pal)})});
}
function palKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();if(P.items.length){P.sel=(P.sel+1)%P.items.length;palList()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(P.items.length){P.sel=(P.sel-1+P.items.length)%P.items.length;palList()}}
  else if(e.key==='Enter'){e.preventDefault();if(P.items.length)runPal(P.sel)}
  else if(e.key==='Escape'){e.preventDefault();closePal()}
}
function runPal(i){var it=P.items[i];closePal(true);if(it)it.run()}
function closePal(noReturn){P.open=false;$('#palette').innerHTML='';if(!noReturn&&P.ret&&P.ret.focus)P.ret.focus()}

if(phoneMQ.addEventListener)phoneMQ.addEventListener('change',function(){render()});
/* keep in step with the other pages: another tab saved the shared store, or we came back with the browser's Back button */
/* one refresh path for every outside change: ganki-data.js reloads GK.db when another tab saves and calls window.GKrefresh;
   the page's own storage / Back-button listeners only reload the store and ask for the same refresh. Calls in the same tick
   are merged, so a save seen by both listeners renders once. A log form that is being written is left alone. */
var refreshT=null;
/* what the user is typing survives the re-render: focus + caret, and the values of the open inputs */
var KEEP_IDS=['note-text','note-scope','rs-date','rs-time','rs-told','today-q','ho-q','mock-search','td-t','td-due','td-uq'];
function keepFocus(fn){
  var a=document.activeElement,id=a&&a.id,sel=null,vals={};
  try{if(a&&typeof a.selectionStart==='number')sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  KEEP_IDS.forEach(function(k){var x=document.getElementById(k);if(x)vals[k]=x.type==='checkbox'?{c:!!x.checked}:{v:x.value}});
  fn();
  Object.keys(vals).forEach(function(k){var x=document.getElementById(k);if(!x)return;if('c' in vals[k])x.checked=vals[k].c;else if(x.value!==vals[k].v)x.value=vals[k].v});
  if(id){var n=document.getElementById(id);if(n&&n!==a&&n.focus){try{n.focus();if(sel&&n.setSelectionRange)n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function refreshNow(){refreshT=null;if(GK.pageIsOff&&GK.pageIsOff())return;
  /* 機能の設定 changed: whatever is open for a feature that is now OFF is closed with a short note */
  if(S.panel&&S.panel.type==='log'&&!GK.can('act.record')){S.panel=null;renderPanel();GK.offToast('対応の記録')}
  if(D.resched&&!GK.can('act.resched')){D.resched=null;GK.offToast('日程を変える')}
  if(D.td&&(!GK.can('act.addtask')||(D.td.from==='memo'&&!GK.can('act.memotodo')))){var wasMemo=D.td.from==='memo';D.td=null;GK.offToast(wasMemo?'メモからやることにする':'やることを追加')}  if(S.editing&&!GK.can('act.layout')){S.layout=JSON.parse(S.before);S.editing=false;S.drawer=false;S.addAction=false;S.confirmHide=null;S.hist=[];renderEditbar();renderDrawer();GK.offToast('並びを変える')}
  if(P.open&&!GK.can('in.palette'))closePal(true);
  keepFocus(function(){
  buildData();buildMo();
  /* the task being rescheduled was removed elsewhere: close its form */
  if(D.resched&&!taskBy(D.resched))D.resched=null;
  renderNav();renderHead();renderTip();renderQuick();renderBoard();if(S.drawer)renderDrawer();if(S.panel&&S.panel.type!=='log')renderPanel(true);
})}
function refreshSoon(){if(refreshT)return;refreshT=setTimeout(refreshNow,0)}
window.GKrefresh=function(){refreshSoon()};
/* (a refresh already pending means ganki-data.js has reloaded the store for this event) */
window.addEventListener('storage',function(e){if(e.key===(GK.KEY||'ganki-demo-db-v1')&&!refreshT&&!(GK.pageIsOff&&GK.pageIsOff())){GK.db=GK.load();refreshSoon()}});
window.addEventListener('pageshow',function(e){if(e.persisted&&!refreshT&&!(GK.pageIsOff&&GK.pageIsOff())){GK.db=GK.load();refreshSoon()}});
render();
})();
</script>
