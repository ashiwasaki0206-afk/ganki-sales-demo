<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理物件 まとめて登録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="ganki-base.css">
<script src="ganki-local-data.js"></script>
<script src="ganki-data.js"></script>
<script src="ganki-docs.js"></script>
<script src="ganki-jonojo.js"></script>
<style>
/* Wizard-only rules. Shell, buttons, pills, toast, fields and colours come from ganki-base.css. */
.head p{font-size:13px;color:var(--muted)}
.restore{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
#restore{display:flex;flex-direction:column;gap:8px}
#restore:empty{display:none}

/* step bar */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{flex:1 1 0;min-width:110px}
.steps button{width:100%;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;font-size:13px;color:var(--muted)}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);flex-shrink:0}
.steps button[aria-current="step"]{border-color:var(--primary);color:var(--fg);font-weight:500}
.steps button[aria-current="step"] .n{background:var(--primary);color:var(--primary-fg)}
.steps .is-done .n{background:var(--ok-soft);color:var(--ok)}
.steps .skip{opacity:.55}
.steps button:disabled{cursor:not-allowed}
.step-now{display:none;font-size:13px;font-weight:500}

.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.card{padding:18px 20px;gap:16px}
.card h2{font-size:17px}
.lead{font-size:13px;color:var(--muted);margin-top:2px}

.mode{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.mode button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--shadow)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid .wide{grid-column:1 / -1}
.hint{font-size:12px;color:var(--muted)}
.auto{font-size:11px;color:var(--primary);background:var(--primary-soft);border-radius:4px;padding:0 5px;margin-left:6px}
.read{background:#fffbe9!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.pick{display:flex;flex-direction:column;gap:6px}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.pick label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.pick label.off{cursor:not-allowed;opacity:.7;background:var(--surface-2)}
.pick input{margin-top:4px;accent-color:var(--primary)}
.pick .t{font-weight:500}
.pick .s{font-size:12px;color:var(--muted)}
.search{width:100%}

.dup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}

.rooms{display:flex;flex-direction:column;gap:8px}
.room{display:grid;grid-template-columns:90px 110px minmax(0,1fr) auto;gap:8px;align-items:end}
.room .field label{font-size:11.5px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.bulk input{width:70px;border:1px solid var(--input);border-radius:7px;padding:5px 8px;background:var(--surface)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.foot .r{display:flex;gap:8px;flex-wrap:wrap}

/* summary */
.sum{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sum h2{font-size:14px}
.sum dl{margin:0;display:flex;flex-direction:column;gap:10px}
.sum .blk{border-top:1px solid var(--line);padding-top:10px}
.sum dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between}
.sum dd{margin:2px 0 0;font-size:13px}
.sum .empty{padding:0;text-align:left;font-size:inherit;color:var(--muted)}
.pill.new{background:var(--primary-soft);color:var(--primary)}

.confirm{display:flex;flex-direction:column;gap:10px}
.cbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cbox .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cbox .h b{font-size:13.5px}
.cbox .kv{grid-template-columns:7em minmax(0,1fr);gap:2px 10px}
.result{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.result .big{font-size:18px;font-weight:700;color:var(--ok)}
.result ul{margin:0;padding-left:1.2em;font-size:13px}

@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}.sum{position:static;order:-1}}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px}
  .steps li{min-width:0}
  .steps .lab{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .steps button{justify-content:center}
  .step-now{display:block}
  .room{grid-template-columns:1fr 1fr;}
  .room .field:nth-child(3){grid-column:1 / -1}
  .sum dl{display:none}
  .sum.open dl{display:flex}
}
</style></head><body>
<div class="topbar" id="topbar"></div>
<div class="app">
  <aside class="side" id="side" aria-label="メインメニュー"></aside>
  <main class="main">
    <header class="head">
      <div><h1>管理物件をまとめて登録</h1><p>オーナー → 物件・部屋 → 入居者 → 契約 の順に、1つの画面で登録します。あとの手順で前の内容も直せます。</p></div>
      <button class="btn ghost" type="button" id="reset">最初からやり直す</button>
    </header>
    <div id="restore"></div>
    <ol class="steps" id="steps" aria-label="登録の手順"></ol>
    <p class="step-now" id="stepNow"></p>
    <div class="work">
      <section class="card" id="card" aria-live="polite"></section>
      <aside class="sum" id="sum" aria-label="登録する内容"></aside>
    </div>
    <p class="hint">登録した内容は、物件・台帳や入居者のページにも出ます。</p>
  </main>
</div>
<div id="toast"></div>

<script>
(function(){
GK.shell('properties.html');
if(GK.pageGate('page.register'))return; /* 機能の設定: this screen is OFF for the current person */
var $=function(s){return document.querySelector(s)};
var esc=GK.esc;
/* phone numbers: 090-1234-5678 form on save and on screen (ganki-data.js); as typed with an older ganki-data.js */
function ft(s){return typeof GK.formatTel==='function'?GK.formatTel(s):String(s==null?'':s).trim()}

/* ---- data already in the system: read from the shared demo store (ganki-data.js) ---- */
var OWNERS,PROPS,TENANTS;
function rebuild(){
  var db=GK.db;
  OWNERS=db.owners.map(function(o){return {id:o.id,n:o.n,k:o.k,tel:o.tel,props:db.props.filter(function(p){return p.owner===o.id}).map(function(p){return p.n})}});
  PROPS={};
  /* room rows: [no, layout, status, tenant text, move-out date, rent, fee] */
  db.props.forEach(function(p){PROPS[p.n]={id:p.id,owner:p.owner,addr:p.addr,rooms:db.units.filter(function(u){return u.prop===p.id}).map(function(u){
    var st=GK.unitStatus(u),a=GK.activeLease(u.id),t=a&&(GK.tenant(a.tenant)||{n:'（未登録）'});
    if(st==='入居予定'){var pl=db.leases.filter(function(l){return l.unit===u.id&&l.status==='入居予定'})[0];return [u.no,u.lay,'入居中',(GK.tenant(pl.tenant)||{n:'（未登録）'}).n+' 様（'+GK.sd(pl.start)+' 入居予定）','',u.rent,u.fee]}
    return [u.no,u.lay,st==='入居中'||st==='退去予定'?st:'空室',st==='入居中'?t.n+' 様':st==='退去予定'?t.n+' 様（'+GK.sd(a.notice.date)+' 退去）':st!=='空室'?st:'',st==='退去予定'?a.notice.date:'',u.rent,u.fee]})}});
  TENANTS=db.tenants.filter(function(t){return db.leases.some(function(l){return l.tenant===t.id&&(l.status==='申込中'||l.status==='終了')})&&!db.leases.some(function(l){return l.tenant===t.id&&(l.status==='有効'||l.status==='入居予定')})}).map(function(t){
    var ls=db.leases.filter(function(l){return l.tenant===t.id}).sort(function(a,b){return a.start<b.start?1:-1}),l=ls[0];
    return {id:t.id,n:t.n,k:t.k||'',tel:t.tel||'',note:l.status==='申込中'?'申込あり（'+GK.roomLabel(l.unit)+'）':'元 '+GK.roomLabel(l.unit)+(l.end?'（'+String(l.end).slice(0,7).replace('-','/')+' 退去）':'')}});
  OWNERS.forEach(function(o){o.k=o.k||'';o.tel=o.tel||''});
}
rebuild();
/* the person gets a contract: like turnover.html, all of their 申込中 leases are cancelled (取消（新しい契約へ）), and a room that
   showed 「申込あり」 only because of them goes back to 募集中. onlyUnit: a new 申込中 replaces just the old one for the same room. */
function cancelApplications(tid,onlyUnit){
  var db=GK.db,rooms=[];
  db.leases.forEach(function(l){if(l.tenant===tid&&l.status==='申込中'&&(!onlyUnit||l.unit===onlyUnit)){l.status='取消（新しい契約へ）';if(rooms.indexOf(l.unit)<0)rooms.push(l.unit)}});
  rooms.forEach(function(id){
    var u=GK.unit(id);if(!u||u.vacant!=='申込あり')return;
    var still=db.leases.some(function(l){return l.unit===id&&(l.status==='申込中'||l.status==='入居予定'||l.status==='有効')});
    if(!still)u.vacant='募集中';
  });
}
/* save everything in one go (the real system does this in one database transaction) */
function commit(){
  var db=GK.db,stamp=Date.now(),oid,pid,unitId='',nr=newRooms();
  if(S.owner.mode==='pick')oid=S.owner.id;
  else{oid='o'+stamp;db.owners.push({id:oid,n:S.owner.n.trim(),k:S.owner.k.trim(),tel:ft(S.owner.tel),mail:S.owner.mail.trim(),addr:S.owner.addr.trim(),bank:S.owner.bank.trim(),fee:5})}
  if(S.prop.mode==='pick'){
    pid=PROPS[S.prop.pick].id;var pp=GK.prop(pid);
    /* rooms added to a property that is already registered */
    nr.forEach(function(r){var id=pid+'-'+r.no;if(GK.unit(id))return;db.units.push({id:id,prop:pid,no:r.no,lay:String(r.lay||'').trim()||'未登録',area:0,rent:GK.num(r.rent),fee:0,vacant:'募集中'});if(pp&&pp.rooms.indexOf(r.no)<0)pp.rooms.push(r.no)});
  }else{
    var pn=700+db.props.length;do{pid='GK-'+String(pn++).padStart(4,'0')}while(GK.prop(pid)); /* never reuse an id another page (takeover) already took */
    db.props.push({id:pid,n:S.prop.name.trim(),owner:oid,addr:S.prop.addr.trim(),type:'',since:S.prop.start,rooms:nr.map(function(r){return r.no})});
    nr.forEach(function(r){db.units.push({id:pid+'-'+r.no,prop:pid,no:r.no,lay:String(r.lay||'').trim()||'未登録',area:0,rent:GK.num(r.rent),fee:0,vacant:'募集中'})});
  }
  var note='まとめて登録：'+(S.owner.mode==='new'?'オーナー「'+S.owner.n.trim()+'」、':'')+(S.prop.mode==='new'?'物件「'+S.prop.name.trim()+'」と部屋 '+nr.length+'室':'物件「'+S.prop.pick+'」'+(nr.length?'に部屋 '+nr.length+'室を追加':''));
  if(!skipTenant()){
    var tid;unitId=pid+'-'+S.prop.target;
    if(S.tenant.mode==='pick')tid=S.tenant.id;
    else{tid='T'+stamp;db.tenants.push({id:tid,n:S.tenant.n.trim(),k:S.tenant.k.trim(),tel:ft(S.tenant.tel),mail:S.tenant.mail.trim(),emName:S.tenant.emName.trim(),emTel:ft(S.tenant.emTel),work:S.tenant.work.trim()})}
    /* 本人確認書類で確かめた記録（種類・日付・担当だけ。番号や画像は持たない） */
    if(S.tenant.idCheck){var it=GK.tenant(tid);if(it)it.idCheck=S.tenant.idCheck}
    var start=S.lease.start,active=S.lease.status==='ACTIVE';
    cancelApplications(tid,active?null:unitId);
    db.leases.push({id:'L'+stamp,unit:unitId,tenant:tid,start:start,end:S.lease.end||autoEnd(),rent:GK.num(S.lease.rent),fee:GK.num(S.lease.fee),dep:GK.num(S.lease.dep),pay:S.lease.pay==='末日'?31:+S.lease.pay,gua:S.lease.gua==='あり'?S.lease.guaName:'',status:active?(start>GK.TODAY?'入居予定':'有効'):'申込中',agreedAt:active?GK.TODAY:''});
    var u=GK.unit(unitId);if(u&&active)u.vacant='';
    note+='、'+GK.roomLabel(unitId)+' の契約（'+leaseLabel()+'）';
  }
  GK.log(note,unitId||(nr.length?pid+'-'+nr[0].no:''));GK.save();
  S._savedOwner=oid;S._savedProp=S.prop.mode==='pick'?S.prop.pick:S.prop.name.trim();S._savedUnit=unitId||(nr.length?pid+'-'+nr[0].no:(GK.db.units.filter(function(u){return u.prop===pid})[0]||{}).id);
  rebuild();
}
var GUA=['ガンキ保証','東日本保証','全国家賃保証'];
if(GK.LOCAL&&GK.guaNames)GUA=GK.guaNames(GUA); /* 社内検証用のデータ: the 保証会社 names in the contracts */
var PAY=['1','5','10','15','20','25','27','末日'].map(function(v){return [v,v==='末日'?'末日':v+'日']});
var STEPS=[['owner','オーナー'],['prop','物件・部屋'],['tenant','入居者'],['lease','契約'],['check','確認']];
var FNM=GK.firstOfNextMonth(GK.TODAY);

/* ---- state (a draft is kept in this browser while typing) ---- */
var KEY='ganki-register-draft',PREV='ganki-register-draft-prev';
function blank(){return {step:0,
  owner:{mode:'pick',id:'',n:'',k:'',tel:'',mail:'',addr:'',bank:''},
  prop:{mode:'new',name:'',addr:'',start:FNM,rooms:[{no:'',lay:'',rent:''}],pick:'',target:''},
  tenant:{mode:'new',id:'',n:'',k:'',tel:'',mail:'',emName:'',emTel:'',work:'',read:false},
  lease:{start:FNM,end:'',rent:'',fee:'',dep:'',pay:'27',gua:'あり',guaName:GK.LOCAL?GUA[0]:'ガンキ保証',status:'ACTIVE'},
  saved:false}}
function core(s){return JSON.stringify({o:s.owner,p:s.prop,t:s.tenant,l:s.lease})}
function hasInput(s){try{return core(s)!==core(blank())}catch(e){return false}}
var S=blank(),errs={},older=null,hashNote='';
function keep(){if(S.saved||!hasInput(S)){GK.store.drop(KEY);return}GK.store.set(KEY,S)}

/* ---- helpers ---- */
function owner(){if(S.owner.mode==='pick'){return OWNERS.filter(function(o){return o.id===S.owner.id})[0]||null}return S.owner.n.trim()?{n:S.owner.n.trim(),isNew:true}:null}
function propName(){return S.prop.mode==='pick'?S.prop.pick:S.prop.name.trim()}
function newRooms(){return S.prop.rooms.filter(function(r){return String(r.no).trim()}).map(function(r){return {no:String(r.no).trim(),lay:r.lay,rent:r.rent,st:'新規',ten:'',out:''}})}
function existingRooms(){var P=S.prop.mode==='pick'&&PROPS[S.prop.pick];return P?P.rooms.map(function(r){return {no:r[0],lay:r[1],st:r[2],ten:r[3],out:r[4]||'',rent:r[5]||'',fee:r[6]||''}}):[]}
function roomsList(){if(S.prop.mode==='pick')return PROPS[S.prop.pick]?existingRooms().concat(newRooms()):[];return newRooms()}
function targetRoom(){return roomsList().filter(function(r){return r.no===S.prop.target})[0]||null}
function vacantOnly(){return S.prop.target==='none'}
function skipTenant(){return vacantOnly()}
function tenant(){if(S.tenant.mode==='pick')return TENANTS.filter(function(t){return t.id===S.tenant.id})[0]||null;return S.tenant.n.trim()?{n:S.tenant.n.trim(),isNew:true}:null}
function autoEnd(){var s=S.lease.start;if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return '';var d=new Date(s+'T00:00:00');d.setFullYear(d.getFullYear()+2);d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function leaseLabel(){return S.lease.status==='ACTIVE'?(S.lease.start>GK.TODAY?'入居予定':'契約中'):'申込中'}
function jp(s){if(!s)return '';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?m[1]+'/'+m[2]+'/'+m[3]:s}
function md(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return '';var d=new Date(m[1],m[2]-1,m[3]);return (+m[2])+'/'+(+m[3])+'（'+'日月火水木金土'[d.getDay()]+'）'}
function yen(v){var n=+String(v).replace(/[^\d]/g,'');return n?'¥'+n.toLocaleString():''}
function norm(s){return String(s).replace(/[\s　]/g,'').replace(/株式会社|（株）|\(株\)/g,'')}
function similar(list,name,tel){
  var n=norm(name),t=String(tel||'').replace(/\D/g,'');
  if(!n&&!t)return null;
  return list.filter(function(x){var xn=norm(x.n);return (n.length>=2&&xn&&(xn.indexOf(n)>=0||n.indexOf(xn)>=0))||(t.length>=10&&String(x.tel||'').replace(/\D/g,'')===t)})[0]||null;
}
function toast(m,undo){GK.toast(m,undo)}

/* ---- 書類から読み込む (ganki-docs.js) ----
   入居者・契約の手順: 入居申込書・賃貸借契約書・保証会社の契約書 -> 入居者 + 契約 (+ 保証会社) の欄。物件・部屋の手順: 重要事項説明書。
   The values go into S exactly like typed ones (errors cleared, draft kept, the step drawn again); 元に戻す puts S back. */
function docBar(id,hint){if(!GK.can('doc.read'))return '';return '<div class="gkd-bar"><button class="btn" type="button" id="'+id+'">書類から読み込む</button><span class="hint">'+hint+'</span></div>'}
function idLab(rec){return GK.docs&&GK.docs.idLabel?GK.docs.idLabel(rec):'済み'}
function payOpts(){return !S.lease.pay||PAY.some(function(p){return p[0]===S.lease.pay})?PAY:PAY.concat([[S.lease.pay,S.lease.pay+'日']])}
function guaOpts(){return !S.lease.guaName||GUA.indexOf(S.lease.guaName)>=0?GUA:GUA.concat([S.lease.guaName])}
function noDocs(){if(GK.docs)return false;toast('書類の読み込みを開けませんでした。画面を開き直してください');return true}
function docFieldsTL(){
  var f=[],t=S.tenant,l=S.lease;
  if(t.mode==='new')f.push(
    {key:'tenant.n',doc:'name',label:'名前',cur:t.n},{key:'tenant.k',doc:'kana',label:'フリガナ',cur:t.k},
    {key:'tenant.tel',doc:'tel',label:'電話番号',cur:t.tel},{key:'tenant.mail',doc:'mail',label:'メール',cur:t.mail},
    {key:'tenant.work',doc:'work',label:'勤務先',cur:t.work},
    {key:'tenant.emName',doc:'emLabel',label:'緊急連絡先の名前',cur:t.emName},{key:'tenant.emTel',doc:'emTel',label:'緊急連絡先の電話',cur:t.emTel});
  else{var p=tenant();f.push({key:'_who',doc:'name',label:'入居者（選んだ人）',cur:p?p.n:'',check:true})}
  f.push({key:'lease.start',doc:'start',label:'入居日（契約開始日）',cur:l.start},{key:'lease.end',doc:'end',label:'契約終了日',cur:l.end||autoEnd()},
    {key:'lease.rent',doc:'rent',label:'家賃（月額・円）',cur:l.rent},{key:'lease.fee',doc:'fee',label:'共益費（月額・円）',cur:l.fee},
    {key:'lease.dep',doc:'dep',label:'敷金（円）',cur:l.dep},{key:'lease.pay',doc:'pay',label:'毎月の支払日',cur:l.pay==='末日'?'31':l.pay},
    {key:'lease.guaName',doc:'gua',label:'保証会社',cur:l.gua==='あり'?l.guaName:'なし'},
    {key:'_prop',doc:'propName',label:'物件名',cur:propName(),check:true},{key:'_room',doc:'roomNo',label:'部屋番号',cur:S.prop.target,check:true});
  return f;
}
function openDocsTL(){
  if(noDocs())return;
  var tr=targetRoom()||{};

/* ---- validation per step (returns {field:message}) ---- */
function check(i){
  var e={},k=STEPS[i][0];
  if(k==='owner'){
    if(S.owner.mode==='pick'){if(!S.owner.id)e.ownerPick='オーナーを1人選んでください。いない場合は「新しく登録」を押してください。'}
    else if(!S.owner.n.trim())e['owner.n']='オーナーの名前（法人名）を入れてください。';
  }
  if(k==='prop'){
    var nos=S.prop.rooms.map(function(r){return String(r.no).trim()}).filter(Boolean);
    if(S.prop.mode==='pick'){
      if(!S.prop.pick)e.propPick='物件を選んでください。';
      else{var have=existingRooms().map(function(r){return r.no}),clash=nos.filter(function(n){return have.indexOf(n)>=0});if(clash.length)e.rooms=clash[0]+' 号室はもう登録されています。号室を確かめてください。'}
    }else{
      if(!S.prop.name.trim())e['prop.name']='物件名を入れてください。';
      if(!S.prop.addr.trim())e['prop.addr']='所在地を入れてください。';
      if(!nos.length)e.rooms='部屋を1つ以上入れてください（号室だけで登録できます）。';
    }
    var dup=nos.filter(function(n,j){return nos.indexOf(n)!==j});
    if(dup.length)e.rooms=dup[0]+' 号室が2回入っています。';
    if(!S.prop.target)e.target='入居者を登録する部屋を選ぶか、「入居者はあとで」を選んでください。';
    else if(S.prop.target!=='none'&&!targetRoom())e.target='選んでいた '+S.prop.target+' 号室が一覧にありません。部屋を選び直してください。';
    else if(S.prop.target!=='none'&&targetRoom().st==='入居中')e.target=S.prop.target+' 号室には、ほかの画面で入居者が登録されました。別の部屋を選ぶか、「入居者の入れ替え」から進めてください。';
  }
  if(k==='tenant'&&!skipTenant()){
    if(S.tenant.mode==='pick'){if(!S.tenant.id)e.tenantPick='入居者を選んでください。'}
    else{if(!S.tenant.n.trim())e['tenant.n']='入居者の名前を入れてください。';if(!S.tenant.tel.trim())e['tenant.tel']='電話番号を入れてください（連絡がつく番号）。'}
  }
  if(k==='lease'&&!skipTenant()){
    var tr=targetRoom();
    if(!S.lease.start)e['lease.start']='入居日（契約開始日）を入れてください。';
    else if(tr&&tr.out&&S.lease.start<=tr.out)e['lease.start']='前の入居者の退去日（'+md(tr.out)+'）と重なっています。翌日の '+md(GK.addDays(tr.out,1))+' 以降にしてください。';
    if(!String(S.lease.rent).replace(/\D/g,''))e['lease.rent']='家賃を入れてください。';
    var end=S.lease.end||autoEnd();if(end&&S.lease.start&&end<=S.lease.start)e['lease.end']='契約終了日は開始日より後にしてください。';
    if(S.lease.gua==='あり'&&!S.lease.guaName)e['lease.guaName']='保証会社を選んでください。';
  }
  return e;
}
function firstBad(){for(var i=0;i<4;i++){if(skipTenant()&&(i===2||i===3))continue;if(Object.keys(check(i)).length)return i}return -1}

/* ---- another tab saved (ganki-data.js reloads GK.db, then calls this) ----

var composing=false,pending=false;

function refresh(){
  rebuild();

  render();

}

   A different owner is switched too (said in the label); the toast can undo everything. go=false: only the label. */
window.GKaddrUseRegistered=function(p,go){

  var o=GK.owner(p.owner);if(!o)return '';
  var same=S.owner.mode==='pick'&&S.owner.id===p.owner;
  if(!go)return '登録済みの物件に追加'+(same?'':'（オーナー：'+o.n+'）');
  var prev=JSON.parse(JSON.stringify(S));
  if(!same){S.owner.mode='pick';S.owner.id=p.owner}
  S.prop.mode='pick';S.prop.pick=p.n;S.prop.target='';errs={};keep();render();
  var r=document.querySelector('input[name="prop"]:checked');if(r)r.focus();
  toast('「'+p.n+'」に部屋を追加します'+(same?'':'（オーナーを '+o.n+' さんにしました）'),function(){S=prev;keep();render();toast('元に戻しました')});
  return 'ok';
};
